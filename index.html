<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobby Boxing V4</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ef233c;
    --blue: #2563eb;
    --dark: #090a12;
    --panel: #151827;
    --gold: #ffd166;
}

body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #070810;
    color: white;
    user-select: none;
}

/* =========================================
   MAIN GAME
========================================= */

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 35%,
            #303653 0%,
            #171a2b 42%,
            #080910 100%
        );
}

/* =========================================
   ARENA LIGHTS
========================================= */

.arena-light {
    position: absolute;
    top: -20%;
    width: 25%;
    height: 75%;
    opacity: .13;
    background: linear-gradient(
        180deg,
        white,
        transparent 75%
    );
    filter: blur(14px);
    pointer-events: none;
}

.arena-light.one {
    left: 4%;
    transform: rotate(12deg);
}

.arena-light.two {
    left: 38%;
}

.arena-light.three {
    right: 4%;
    transform: rotate(-12deg);
}

/* =========================================
   ARENA BACKGROUND
========================================= */

#arenaBack {
    position: absolute;
    left: 0;
    right: 0;
    top: 16%;
    bottom: 0;
    overflow: hidden;
}

/* Crowd */

.crowd-row {
    position: absolute;
    left: 0;
    width: 100%;
    text-align: center;
    white-space: nowrap;
    color: #3c4162;
    letter-spacing: 16px;
    font-size: 30px;
}

.crowd-row.one {
    top: 3%;
}

.crowd-row.two {
    top: 13%;
    color: #282d49;
    font-size: 26px;
}

/* Arena banners */

.banner {
    position: absolute;
    top: 5%;
    width: 230px;
    height: 55px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    letter-spacing: 2px;
    background: #111525;
    border: 2px solid #414866;
    box-shadow: 0 8px 20px #000;
}

.banner.left {
    left: 8%;
    color: #4d8cff;
}

.banner.right {
    right: 8%;
    color: #ff4058;
}

/* =========================================
   TOP HEADER
========================================= */

#header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 105px;
    z-index: 50;
    background:
        linear-gradient(
            180deg,
            rgba(5,6,12,.98),
            rgba(5,6,12,.86),
            transparent
        );
}

/* Game title */

#gameTitle {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);

    font-size: clamp(27px, 4vw, 48px);
    font-weight: 1000;
    letter-spacing: 5px;
    white-space: nowrap;

    color: white;
    text-shadow:
        3px 3px 0 #050505,
        0 0 18px rgba(239,35,60,.5);
}

#gameTitle span {
    color: var(--red);
}

/* =========================================
   PLAYER HUD
========================================= */

.fighterHUD {
    position: absolute;
    top: 22px;
    width: 28%;
    min-width: 240px;
}

#bobbyHUD {
    left: 3%;
}

#venomHUD {
    right: 3%;
    text-align: right;
}

.hudName {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 7px;

    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
}

#venomHUD .hudName {
    justify-content: flex-end;
}

.nameIcon {
    width: 10px;
    height: 24px;
    border-radius: 3px;
}

.blueIcon {
    background: var(--blue);
}

.redIcon {
    background: var(--red);
}

/* Bars */

.statBar {
    position: relative;
    width: 100%;
    height: 18px;
    margin-bottom: 5px;

    background: #090a10;
    border: 2px solid #60677d;
    border-radius: 3px;
    overflow: hidden;
}

.statFill {
    height: 100%;
    width: 100%;
    transition: width .2s;
}

.healthFill {
    background:
        linear-gradient(
            90deg,
            #16a34a,
            #34d058
        );
}

.staminaFill {
    background:
        linear-gradient(
            90deg,
            #1473d2,
            #36a9ff
        );
}

.statText {
    position: absolute;
    left: 8px;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;

    text-shadow: 1px 1px #000;
}

#venomHUD .statText {
    left: auto;
    right: 8px;
}

/* =========================================
   ROUND DISPLAY
========================================= */

#roundDisplay {
    position: absolute;
    left: 50%;
    top: 68px;
    transform: translateX(-50%);

    z-index: 60;
    text-align: center;
}

#roundText {
    color: #b7bdd1;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
}

#timer {
    margin-top: 1px;
    font-size: 27px;
    line-height: 27px;
    font-weight: 1000;
}

/* =========================================
   RING
========================================= */

#ring {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 10%;
    height: 59%;

    border: 11px solid #090a0d;

    background:
        linear-gradient(
            rgba(255,255,255,.08),
            rgba(255,255,255,0)
        ),
        repeating-linear-gradient(
            45deg,
            #e9e9e9 0px,
            #e9e9e9 28px,
            #d5d5d5 28px,
            #d5d5d5 56px
        );

    box-shadow:
        0 20px 45px rgba(0,0,0,.8),
        inset 0 0 50px rgba(0,0,0,.2);

    overflow: hidden;
}

/* Ring canvas */

#ringFloor {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.12)
        );
}

/* =========================================
   ROPES
========================================= */

.rope {
    position: absolute;
    left: -12px;
    right: -12px;
    height: 7px;
    z-index: 30;

    background:
        linear-gradient(
            #ff4355,
            #d7192d
        );

    box-shadow:
        0 2px 3px rgba(0,0,0,.45);
}

.rope.top {
    top: 18%;
}

.rope.middle {
    top: 43%;
}

.rope.bottom {
    top: 68%;
}

/* =========================================
   POSTS
========================================= */

.post {
    position: absolute;
    top: -18px;
    bottom: -18px;
    width: 24px;
    background:
        linear-gradient(
            90deg,
            #080808,
            #292929,
            #080808
        );
    z-index: 40;
}

.post.left {
    left: 4%;
}

.post.right {
    right: 4%;
}

/* =========================================
   CORNER PADS
========================================= */

.cornerPad {
    position: absolute;
    top: 10%;
    width: 55px;
    height: 115px;
    z-index: 42;

    background: #10121c;
    border: 3px solid #34394c;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
}

.cornerPad.left {
    left: 2.5%;
    color: #3980ff;
}

.cornerPad.right {
    right: 2.5%;
    color: #ff334c;
}

/* =========================================
   FIGHTER CONTAINER
========================================= */

.fighter {
    position: absolute;
    width: 120px;
    height: 220px;

    bottom: 12%;

    z-index: 25;

    transition:
        left .07s linear,
        bottom .15s ease;
}

/* =========================================
   BODY
========================================= */

.head {
    position: absolute;
    width: 48px;
    height: 48px;
    left: 36px;
    top: 0;

    background: #c98761;
    border: 4px solid #101010;
    border-radius: 50%;
    z-index: 10;
}

/* Hair */

.head::before {
    content: "";
    position: absolute;
    left: 1px;
    top: -5px;

    width: 39px;
    height: 18px;

    background: #111;
    border-radius: 50% 50% 15% 15%;
}

/* Eye */

.head::after {
    content: "";
    position: absolute;
    right: 5px;
    top: 20px;

    width: 7px;
    height: 7px;

    background: white;
    border-radius: 50%;
}

/* Neck */

.neck {
    position: absolute;
    top: 39px;
    left: 51px;
    width: 17px;
    height: 17px;

    background: #bd7855;
    border: 3px solid #111;
    z-index: 3;
}

/* Torso */

.torso {
    position: absolute;
    top: 47px;
    left: 28px;

    width: 64px;
    height: 82px;

    border: 4px solid #101010;
    border-radius: 17px 17px 12px 12px;

    z-index: 5;
}

#bobby .torso {
    background:
        linear-gradient(
            180deg,
            #3180ff,
            #1642a1
        );
}

#venom .torso {
    background:
        linear-gradient(
            180deg,
            #292929,
            #050505
        );
}

/* Chest emblem */

#bobby .torso::after {
    content: "B";

    position: absolute;
    left: 50%;
    top: 22px;
    transform: translateX(-50%);

    width: 29px;
    height: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;
    font-weight: 1000;
    background: #14367d;
    border: 2px solid rgba(255,255,255,.4);
}

/* Venom emblem */

#venom .torso::after {
    content: "V";

    position: absolute;
    left: 50%;
    top: 22px;
    transform: translateX(-50%);

    width: 29px;
    height: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #fff;
    font-weight: 1000;
    background: #111;
    border: 2px solid #555;
}

/* =========================================
   ARMS
========================================= */

.arm {
    position: absolute;

    width: 30px;
    height: 70px;

    top: 53px;

    background: #c98761;

    border: 4px solid #111;
    border-radius: 20px;

    transform-origin: top center;

    z-index: 4;
}

.arm.left {
    left: 5px;
    transform: rotate(28deg);
}

.arm.right {
    right: 5px;
    transform: rotate(-28deg);
}

/* =========================================
   GLOVES
========================================= */

.glove {
    position: absolute;

    width: 39px;
    height: 39px;

    border-radius: 50%;

    border: 4px solid #111;

    z-index: 15;

    box-shadow:
        inset -4px -4px 0 rgba(0,0,0,.18);
}

#bobby .glove {
    background:
        linear-gradient(
            135deg,
            #ff3356,
            #c50f32
        );
}

#venom .glove {
    background:
        linear-gradient(
            135deg,
            #333,
            #030303
        );
    box-shadow:
        0 0 12px rgba(0,0,0,.8);
}

.glove.left {
    left: -7px;
    top: 102px;
}

.glove.right {
    right: -7px;
    top: 102px;
}

/* =========================================
   LEGS
========================================= */

.leg {
    position: absolute;

    width: 29px;
    height: 78px;

    top: 123px;

    background: #101522;

    border: 4px solid #090909;
    border-radius: 0 0 7px 7px;

    z-index: 2;
}

.leg.left {
    left: 29px;
}

.leg.right {
    right: 29px;
}

/* Shoes */

.leg::after {
    content: "";

    position: absolute;

    width: 40px;
    height: 18px;

    bottom: -10px;

    background: #0a0a0a;
    border-radius: 50%;
}

.leg.left::after {
    left: -12px;
}

.leg.right::after {
    right: -12px;
}

/* =========================================
   IDLE ANIMATION
========================================= */

.fighter {
    animation: idle 1.1s infinite ease-in-out;
}

@keyframes idle {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-3px);
    }
}

/* =========================================
   PUNCH ANIMATIONS
========================================= */

.jab .arm.right {
    animation: jab .18s ease-out;
}

.jab .glove.right {
    animation: jabGlove .18s ease-out;
}

@keyframes jab {
    0% {
        transform: rotate(-28deg);
    }

    50% {
        transform:
            rotate(-82deg)
            translateX(34px);
    }

    100% {
        transform: rotate(-28deg);
    }
}

@keyframes jabGlove {
    0% {
        transform: translate(0,0);
    }

    50% {
        transform:
            translate(38px,-20px);
    }

    100% {
        transform: translate(0,0);
    }
}

/* Cross */

.cross .arm.right {
    animation: cross .25s ease-out;
}

.cross .glove.right {
    animation: crossGlove .25s ease-out;
}

@keyframes cross {
    0% {
        transform: rotate(-28deg);
    }

    50% {
        transform:
            rotate(-105deg)
            translateX(46px);
    }

    100% {
        transform: rotate(-28deg);
    }
}

@keyframes crossGlove {
    0% {
        transform: translate(0,0);
    }

    50% {
        transform:
            translate(49px,-31px);
    }

    100% {
        transform: translate(0,0);
    }
}

/* Heavy */

.heavy .arm.right {
    animation: heavy .32s ease-out;
}

.heavy .glove.right {
    animation: heavyGlove .32s ease-out;
}

@keyframes heavy {
    0% {
        transform: rotate(-28deg);
    }

    45% {
        transform:
            rotate(-135deg)
            translateX(55px);
    }

    100% {
        transform: rotate(-28deg);
    }
}

@keyframes heavyGlove {
    0% {
        transform: translate(0,0);
    }

    45% {
        transform:
            translate(58px,-42px)
            scale(1.08);
    }

    100% {
        transform: translate(0,0);
    }
}

/* =========================================
   BLOCK
========================================= */

.block .arm.left {
    transform:
        rotate(-58deg)
        translateY(-25px);
}

.block .arm.right {
    transform:
        rotate(58deg)
        translateY(-25px);
}

.block .glove.left {
    transform:
        translate(12px,-28px);
}

.block .glove.right {
    transform:
        translate(-12px,-28px);
}

/* =========================================
   HIT ANIMATION
========================================= */

.hit {
    animation: hit .23s !important;
}

@keyframes hit {
    0% {
        transform: translateX(0);
    }

    25% {
        transform:
            translateX(18px)
            rotate(4deg);
    }

    50% {
        transform:
            translateX(-10px)
            rotate(-3deg);
    }

    100% {
        transform: translateX(0);
    }
}

/* =========================================
   JUMP
========================================= */

.jump {
    bottom: 34% !important;
}

/* =========================================
   FIGHT MESSAGE
========================================= */

#fightMessage {
    position: absolute;

    left: 50%;
    top: 30%;

    transform: translateX(-50%);

    z-index: 80;

    font-size: clamp(28px, 4vw, 52px);
    font-weight: 1000;
    letter-spacing: 2px;

    color: white;

    text-shadow:
        4px 4px #000,
        0 0 18px rgba(255,255,255,.4);

    opacity: 0;

    pointer-events: none;
}

#fightMessage.show {
    animation: messagePop .8s ease-out;
}

@keyframes messagePop {
    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.6);
    }

    20% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1.15);
    }

    70% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1);
    }

    100% {
        opacity: 0;
    }
}

/* =========================================
   IMPACT EFFECT
========================================= */

#impact {
    position: absolute;

    width: 100px;
    height: 100px;

    z-index: 100;

    pointer-events: none;

    display: none;

    font-size: 70px;
    text-align: center;
}

#impact.show {
    display: block;
    animation: impact .28s ease-out;
}

@keyframes impact {
    0% {
        opacity: 1;
        transform: scale(.3) rotate(-20deg);
    }

    100% {
        opacity: 0;
        transform: scale(1.5) rotate(20deg);
    }
}

/* =========================================
   COMBO
========================================= */

#combo {
    position: absolute;

    left: 50%;
    top: 24%;

    transform: translateX(-50%);

    z-index: 80;

    font-size: 28px;
    font-weight: 1000;

    color: var(--gold);

    text-shadow:
        3px 3px #000,
        0 0 15px #ff9500;

    opacity: 0;
}

#combo.show {
    opacity: 1;
}

/* =========================================
   BOTTOM CONTROL BAR
========================================= */

#controlBar {
    position: absolute;

    left: 50%;
    bottom: 2%;

    transform: translateX(-50%);

    z-index: 100;

    display: flex;
    align-items: center;
    gap: 9px;

    padding: 8px 16px;

    background: rgba(9,10,16,.9);
    border: 1px solid #34394c;
    border-radius: 7px;

    color: #b8bed0;

    font-size: 12px;
}

.key {
    padding: 4px 7px;

    color: white;

    background: #252938;

    border: 1px solid #555d75;
    border-radius: 4px;

    font-weight: 900;
}

/* =========================================
   START SCREEN
========================================= */

#startScreen,
#gameOver {
    position: absolute;

    inset: 0;

    z-index: 300;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(30,34,57,.96),
            rgba(4,5,9,.98)
        );
}

#gameOver {
    display: none;
}

.overlayTitle {
    font-size: clamp(42px, 8vw, 88px);
    font-weight: 1000;
    letter-spacing: 5px;

    text-shadow:
        4px 5px #000,
        0 0 25px rgba(239,35,60,.6);
}

.overlayTitle span {
    color: var(--red);
}

.overlaySub {
    margin-top: 10px;

    color: #aeb4c9;

    font-size: 15px;
    letter-spacing: 3px;
}

.mainButton {
    margin-top: 30px;

    padding: 15px 48px;

    border: 0;
    border-radius: 6px;

    background:
        linear-gradient(
            180deg,
            #ff4057,
            #c91630
        );

    color: white;

    font-size: 18px;
    font-weight: 1000;
    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,.5);
}

.mainButton:hover {
    transform: translateY(-2px);
}

/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 800px) {

    .fighterHUD {
        width: 30%;
        min-width: 150px;
    }

    .hudName {
        font-size: 15px;
    }

    #gameTitle {
        font-size: 25px;
    }

    #controlBar {
        font-size: 9px;
        gap: 4px;
    }

    .key {
        padding: 3px 5px;
    }

    .banner {
        display: none;
    }

}
</style>
</head>

<body>

<div id="game">

    <!-- ARENA LIGHTS -->

    <div class="arena-light one"></div>
    <div class="arena-light two"></div>
    <div class="arena-light three"></div>

    <!-- BACKGROUND -->

    <div id="arenaBack">

        <div class="crowd-row one">
            ● ● ● ● ● ● ● ● ● ● ● ● ● ● ●
        </div>

        <div class="crowd-row two">
            ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ●
        </div>

        <div class="banner left">
            BOBBY BOXING
        </div>

        <div class="banner right">
            FIGHT NIGHT
        </div>

    </div>

    <!-- HEADER -->

    <div id="header">

        <div id="gameTitle">
            BOBBY <span>BOXING</span>
        </div>

    </div>

    <!-- BOBBY HUD -->

    <div id="bobbyHUD" class="fighterHUD">

        <div class="hudName">
            <div class="nameIcon blueIcon"></div>
            BOBBY
        </div>

        <div class="statBar">

            <div
                id="playerHealth"
                class="statFill healthFill">
            </div>

            <div class="statText">
                HEALTH
            </div>

        </div>

        <div class="statBar">

            <div
                id="playerStamina"
                class="statFill staminaFill">
            </div>

            <div class="statText">
                STAMINA
            </div>

        </div>

    </div>

    <!-- VENOM HUD -->

    <div id="venomHUD" class="fighterHUD">

        <div class="hudName">

            VENOM

            <div class="nameIcon redIcon"></div>

        </div>

        <div class="statBar">

            <div
                id="enemyHealth"
                class="statFill healthFill">
            </div>

            <div class="statText">
                HEALTH
            </div>

        </div>

        <div class="statBar">

            <div
                id="enemyStamina"
                class="statFill staminaFill">
            </div>

            <div class="statText">
                STAMINA
            </div>

        </div>

    </div>

    <!-- ROUND -->

    <div id="roundDisplay">

        <div id="roundText">
            ROUND 1
        </div>

        <div id="timer">
            60
        </div>

    </div>

    <!-- RING -->

    <div id="ring">

        <div id="ringFloor"></div>

        <div class="rope top"></div>
        <div class="rope middle"></div>
        <div class="rope bottom"></div>

        <div class="post left"></div>
        <div class="post right"></div>

        <div class="cornerPad left">
            BOBBY
        </div>

        <div class="cornerPad right">
            VENOM
        </div>

        <!-- BOBBY -->

        <div id="bobby" class="fighter">

            <div class="head"></div>

            <div class="neck"></div>

            <div class="torso"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="glove left"></div>
            <div class="glove right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>

        <!-- VENOM -->

        <div id="venom" class="fighter">

            <div class="head"></div>

            <div class="neck"></div>

            <div class="torso"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="glove left"></div>
            <div class="glove right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>

    </div>

    <!-- MESSAGE -->

    <div id="fightMessage">
        FIGHT!
    </div>

    <!-- COMBO -->

    <div id="combo">
        COMBO x2
    </div>

    <!-- IMPACT -->

    <div id="impact">
        💥
    </div>

    <!-- CONTROLS -->

    <div id="controlBar">

        <span class="key">A</span> Move

        <span class="key">D</span> Move

        <span class="key">W</span> Jump

        <span class="key">J</span> Jab

        <span class="key">K</span> Cross

        <span class="key">L</span> Heavy

        <span class="key">S</span> Block

    </div>

    <!-- START SCREEN -->

    <div id="startScreen">

        <div class="overlayTitle">
            BOBBY <span>BOXING</span>
        </div>

        <div class="overlaySub">
            FIGHT NIGHT • ROUND 1
        </div>

        <button
            id="startButton"
            class="mainButton">
            ENTER THE RING
        </button>

    </div>

    <!-- GAME OVER -->

    <div id="gameOver">

        <div
            id="result"
            class="overlayTitle">
            K.O.
        </div>

        <div
            id="resultText"
            class="overlaySub">
            FIGHT OVER
        </div>

        <button
            id="restart"
            class="mainButton">
            REMATCH
        </button>

    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const bobby =
    document.getElementById("bobby");

const venom =
    document.getElementById("venom");

const playerHealth =
    document.getElementById("playerHealth");

const enemyHealth =
    document.getElementById("enemyHealth");

const playerStamina =
    document.getElementById("playerStamina");

const enemyStamina =
    document.getElementById("enemyStamina");

const timer =
    document.getElementById("timer");

const fightMessage =
    document.getElementById("fightMessage");

const comboDisplay =
    document.getElementById("combo");

const impact =
    document.getElementById("impact");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restart");


/* =========================================
   GAME VARIABLES
========================================= */

let playerHP = 100;
let venomHP = 100;

let playerStaminaValue = 100;
let venomStaminaValue = 100;

let playerX = 20;
let venomX = 72;

let jumping = false;
let blocking = false;

let running = false;
let ended = false;

let seconds = 60;

let combo = 0;
let comboTimer = null;

let timerInterval = null;
let aiInterval = null;


/* =========================================
   ATTACK DATA
========================================= */

const attacks = {

    jab: {
        damage: 7,
        stamina: 5,
        animation: "jab",
        text: "JAB!"
    },

    cross: {
        damage: 12,
        stamina: 10,
        animation: "cross",
        text: "CROSS!"
    },

    heavy: {
        damage: 20,
        stamina: 20,
        animation: "heavy",
        text: "HEAVY!"
    }

};


/* =========================================
   START GAME
========================================= */

startButton.addEventListener(
    "click",
    startGame
);

function startGame() {

    startScreen.style.display = "none";

    running = true;

    showFightMessage(
        "FIGHT!"
    );

    startTimer();
}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!running || ended)
            return;

        const key =
            event.key.toLowerCase();

        if (key === "a") {

            movePlayer(-2.5);

        }

        if (key === "d") {

            movePlayer(2.5);

        }

        if (key === "w") {

            jump();

        }

        if (key === "s") {

            startBlock();

        }

        if (key === "j") {

            attack("jab");

        }

        if (key === "k") {

            attack("cross");

        }

        if (key === "l") {

            attack("heavy");

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key.toLowerCase()
            === "s"
        ) {

            stopBlock();

        }

    }
);


/* =========================================
   PLAYER MOVEMENT
========================================= */

function movePlayer(amount) {

    if (blocking)
        return;

    playerX += amount;

    playerX =
        Math.max(
            6,
            Math.min(
                84,
                playerX
            )
        );

    bobby.style.left =
        playerX + "%";

}


/* =========================================
   JUMP
========================================= */

function jump() {

    if (jumping || blocking)
        return;

    jumping = true;

    bobby.classList.add(
        "jump"
    );

    setTimeout(
        function() {

            bobby.classList.remove(
                "jump"
            );

            jumping = false;

        },
        450
    );

}


/* =========================================
   BLOCK
========================================= */

function startBlock() {

    blocking = true;

    bobby.classList.add(
        "block"
    );

    showFightMessage(
        "BLOCK"
    );

}


function stopBlock() {

    blocking = false;

    bobby.classList.remove(
        "block"
    );

}


/* =========================================
   ATTACK
========================================= */

function attack(type) {

    if (blocking)
        return;

    const data =
        attacks[type];

    if (
        playerStaminaValue
        < data.stamina
    ) {

        showFightMessage(
            "TIRED!"
        );

        return;

    }

    playerStaminaValue -=
        data.stamina;

    updateBars();

    bobby.classList.remove(
        "jab",
        "cross",
        "heavy"
    );

    void bobby.offsetWidth;

    bobby.classList.add(
        data.animation
    );

    setTimeout(
        function() {

            bobby.classList.remove(
                data.animation
            );

        },
        330
    );

    const distance =
        Math.abs(
            playerX - venomX
        );

    if (distance <= 23) {

        damageVenom(
            data.damage
        );

        addCombo();

    }
    else {

        showFightMessage(
            "MISS"
        );

    }

}


/* =========================================
   DAMAGE VENOM
========================================= */

function damageVenom(
    damage
) {

    const blocking =
        venom.classList.contains(
            "block"
        );

    if (blocking) {

        damage =
            Math.floor(
                damage * .2
            );

        showFightMessage(
            "BLOCKED"
        );

    }
    else {

        showFightMessage(
            damage >= 18
                ? "CRITICAL HIT!"
                : "HIT!"
        );

        showImpact();

    }

    venomHP -= damage;

    venomHP =
        Math.max(
            0,
            venomHP
        );

    enemyHealth.style.width =
        venomHP + "%";

    venom.classList.add(
        "hit"
    );

    setTimeout(
        function() {

            venom.classList.remove(
                "hit"
            );

        },
        250
    );

    if (venomHP <= 0) {

        winGame();

    }

}


/* =========================================
   COMBO
========================================= */

function addCombo() {

    combo++;

    comboDisplay.innerText =
        "COMBO x" +
        combo;

    comboDisplay.classList.add(
        "show"
    );

    clearTimeout(
        comboTimer
    );

    comboTimer =
        setTimeout(
            function() {

                combo = 0;

                comboDisplay.classList.remove(
                    "show"
                );

            },
            1300
        );

}


/* =========================================
   VENOM AI
========================================= */

function startAI() {

    aiInterval =
        setInterval(
            function() {

                if (
                    !running ||
                    ended
                )
                    return;

                const distance =
                    Math.abs(
                        playerX - venomX
                    );

                /* Approach */

                if (
                    distance > 17
                ) {

                    if (
                        venomX >
                        playerX
                    ) {

                        venomX -= 1.15;

                    }
                    else {

                        venomX += 1.15;

                    }

                    venomX =
                        Math.max(
                            8,
                            Math.min(
                                86,
                                venomX
                            )
                        );

                    venom.style.left =
                        venomX + "%";

                }

                /* Attack */

                if (
                    distance < 21 &&
                    Math.random() < .38
                ) {

                    venomAttack();

                }

                /* Random guard */

                if (
                    distance < 25 &&
                    Math.random() < .12
                ) {

                    venom.classList.add(
                        "block"
                    );

                    setTimeout(
                        function() {

                            venom.classList.remove(
                                "block"
                            );

                        },
                        450
                    );

                }

            },
            420
        );

}


/* =========================================
   VENOM ATTACK
========================================= */

function venomAttack() {

    if (
        venomStaminaValue < 10
    )
        return;

    venomStaminaValue -= 10;

    updateBars();

    if (jumping) {

        showFightMessage(
            "DODGED"
        );

        return;

    }

    let damage =
        Math.random() < .22
            ? 15
            : 8;

    if (blocking) {

        damage =
            Math.floor(
                damage * .2
            );

        showFightMessage(
            "BLOCKED"
        );

    }
    else {

        showFightMessage(
            "VENOM HIT!"
        );

        bobby.classList.add(
            "hit"
        );

        setTimeout(
            function() {

                bobby.classList.remove(
                    "hit"
                );

            },
            250
        );

    }

    playerHP -= damage;

    playerHP =
        Math.max(
            0,
            playerHP
        );

    updateBars();

    if (playerHP <= 0) {

        loseGame();

    }

}


/* =========================================
   STAMINA REGEN
========================================= */

setInterval(
    function() {

        if (!running || ended)
            return;

        if (!blocking) {

            playerStaminaValue += 2;

        }

        venomStaminaValue += 3;

        playerStaminaValue =
            Math.min(
                100,
                playerStaminaValue
            );

        venomStaminaValue =
            Math.min(
                100,
                venomStaminaValue
            );

        updateBars();

    },
    500
);


/* =========================================
   BARS
========================================= */

function updateBars() {

    playerHealth.style.width =
        playerHP + "%";

    enemyHealth.style.width =
        venomHP + "%";

    playerStamina.style.width =
        playerStaminaValue + "%";

    enemyStamina.style.width =
        venomStaminaValue + "%";

}


/* =========================================
   TIMER
========================================= */

function startTimer() {

    timerInterval =
        setInterval(
            function() {

                if (!running || ended)
                    return;

                seconds--;

                timer.innerText =
                    seconds;

                if (
                    seconds <= 10
                ) {

                    timer.style.color =
                        "#ef233c";

                }

                if (
                    seconds <= 0
                ) {

                    endByPoints();

                }

            },
            1000
        );

}


/* =========================================
   FIGHT MESSAGE
========================================= */

function showFightMessage(
    text
) {

    fightMessage.innerText =
        text;

    fightMessage.classList.remove(
        "show"
    );

    void fightMessage.offsetWidth;

    fightMessage.classList.add(
        "show"
    );

}


/* =========================================
   IMPACT
========================================= */

function showImpact() {

    impact.classList.remove(
        "show"
    );

    void impact.offsetWidth;

    impact.classList.add(
        "show"
    );

}


/* =========================================
   WIN
========================================= */

function winGame() {

    endGame();

    result.innerHTML =
        'BOBBY <span>WINS!</span>';

    resultText.innerText =
        "VENOM HAS BEEN KNOCKED OUT";

}


/* =========================================
   LOSE
========================================= */

function loseGame() {

    endGame();

    result.innerHTML =
        'BOBBY <span>KO!</span>';

    resultText.innerText =
        "VENOM TAKES THE FIGHT";

}


/* =========================================
   POINTS
========================================= */

function endByPoints() {

    endGame();

    if (
        playerHP > venomHP
    ) {

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultText.innerText =
            "WIN BY POINTS";

    }
    else if (
        venomHP > playerHP
    ) {

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultText.innerText =
            "VENOM WINS BY POINTS";

    }
    else {

        result.innerHTML =
            'DRAW';

        resultText.innerText =
            "WHAT A FIGHT";

    }

}


/* =========================================
   END GAME
========================================= */

function endGame() {

    ended = true;
    running = false;

    clearInterval(
        timerInterval
    );

    clearInterval(
        aiInterval
    );

    gameOver.style.display =
        "flex";

}


/* =========================================
   RESTART
========================================= */

restartButton.addEventListener(
    "click",
    function() {

        location.reload();

    }
);


/* =========================================
   INITIALIZE
========================================= */

updateBars();

startAI();

</script>

</body>
</html>
