<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bobby Boxing</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #080912;
    font-family: Arial, sans-serif;
    color: white;
}

/* =========================
   GAME
========================= */

#game {
    width: 100vw;
    height: 100vh;
    min-height: 600px;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 30%,
            #30334d,
            #10121f 55%,
            #05060b
        );
}

/* =========================
   LIGHTS
========================= */

.light {
    position: absolute;
    top: -100px;
    width: 250px;
    height: 500px;

    background: rgba(255,255,255,.08);

    filter: blur(30px);

    transform: rotate(15deg);
}

.light1 {
    left: 5%;
}

.light2 {
    left: 42%;
    transform: rotate(0deg);
}

.light3 {
    right: 5%;
    transform: rotate(-15deg);
}

/* =========================
   TITLE
========================= */

#title {
    position: absolute;
    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    font-size: clamp(30px, 5vw, 55px);

    font-weight: 1000;

    letter-spacing: 5px;

    text-shadow:
        4px 4px 0 #000,
        0 0 20px #ef233c;

    z-index: 100;
}

#title span {
    color: #ef233c;
}

/* =========================
   HUD
========================= */

.hud {
    position: absolute;

    top: 25px;

    width: 30%;

    z-index: 100;
}

#playerHUD {
    left: 3%;
}

#enemyHUD {
    right: 3%;
    text-align: right;
}

.name {
    font-size: 20px;
    font-weight: 900;

    margin-bottom: 7px;
}

.bar {
    width: 100%;
    height: 17px;

    margin-bottom: 6px;

    background: #090909;

    border: 2px solid white;

    border-radius: 4px;

    overflow: hidden;
}

.fill {
    width: 100%;
    height: 100%;

    transition: width .15s linear;
}

.health {
    background: #1ed760;
}

.stamina {
    background: #199cf0;
}

/* =========================
   ROUND
========================= */

#round {
    position: absolute;

    top: 70px;
    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 110;
}

#roundNumber {
    font-size: 12px;
    letter-spacing: 3px;
    color: #c9ccda;
}

#time {
    font-size: 32px;
    font-weight: 1000;
}

/* =========================
   CROWD
========================= */

#crowd {
    position: absolute;

    top: 140px;
    left: 0;

    width: 100%;

    text-align: center;

    font-size: 35px;

    letter-spacing: 14px;

    color: #343954;

    opacity: .7;
}

/* =========================
   RING
========================= */

#ring {

    position: absolute;

    left: 5%;
    right: 5%;

    bottom: 8%;

    height: 58%;

    background:
        repeating-linear-gradient(
            45deg,
            #eeeeee,
            #eeeeee 35px,
            #d5d5d5 35px,
            #d5d5d5 70px
        );

    border: 12px solid #090909;

    box-shadow:
        0 20px 40px rgba(0,0,0,.7);

    overflow: hidden;
}

/* =========================
   ROPES
========================= */

.rope {

    position: absolute;

    left: 0;
    right: 0;

    height: 7px;

    background: #e5223b;

    z-index: 20;

    box-shadow:
        0 2px 3px rgba(0,0,0,.4);
}

.rope1 {
    top: 20%;
}

.rope2 {
    top: 45%;
}

.rope3 {
    top: 70%;
}

/* =========================
   POSTS
========================= */

.post {

    position: absolute;

    top: -10px;
    bottom: -10px;

    width: 25px;

    background: #090909;

    z-index: 30;
}

.post.left {
    left: 5%;
}

.post.right {
    right: 5%;
}

/* =========================
   FIGHTER
========================= */

.fighter {

    position: absolute;

    width: 120px;
    height: 220px;

    bottom: 12%;

    z-index: 25;

    transition: left .08s linear;
}

/* =========================
   HEAD
========================= */

.head {

    position: absolute;

    width: 48px;
    height: 48px;

    left: 36px;
    top: 0;

    background: #c9825b;

    border: 4px solid #111;

    border-radius: 50%;

    z-index: 10;
}

/* hair */

.head:before {

    content: "";

    position: absolute;

    left: -1px;
    top: -5px;

    width: 42px;
    height: 18px;

    background: #111;

    border-radius: 50% 50% 20% 20%;
}

/* eye */

.head:after {

    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    right: 5px;
    top: 20px;

    background: white;

    border-radius: 50%;
}

/* =========================
   BODY
========================= */

.body {

    position: absolute;

    left: 27px;
    top: 48px;

    width: 66px;
    height: 84px;

    border: 4px solid #111;

    border-radius: 16px;

    z-index: 5;
}

#bobby .body {

    background:
        linear-gradient(
            #2874df,
            #123c96
        );
}

#venom .body {

    background:
        linear-gradient(
            #292929,
            #050505
        );
}

/* =========================
   ARMS
========================= */

.arm {

    position: absolute;

    top: 55px;

    width: 30px;
    height: 68px;

    background: #c9825b;

    border: 4px solid #111;

    border-radius: 20px;

    transform-origin: top center;

    z-index: 4;
}

.arm.left {
    left: 5px;

    transform: rotate(25deg);
}

.arm.right {
    right: 5px;

    transform: rotate(-25deg);
}

/* =========================
   GLOVES
========================= */

.glove {

    position: absolute;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    border: 4px solid #111;

    z-index: 15;
}

#bobby .glove {
    background: #ef2448;
}

#venom .glove {
    background: #090909;
}

.glove.left {
    left: -5px;
    top: 104px;
}

.glove.right {
    right: -5px;
    top: 104px;
}

/* =========================
   LEGS
========================= */

.leg {

    position: absolute;

    top: 126px;

    width: 30px;
    height: 80px;

    background: #101522;

    border: 4px solid #090909;

    z-index: 2;
}

.leg.left {
    left: 29px;
}

.leg.right {
    right: 29px;
}

/* shoes */

.leg:after {

    content: "";

    position: absolute;

    bottom: -10px;

    width: 42px;
    height: 18px;

    background: #080808;

    border-radius: 50%;
}

.leg.left:after {
    left: -12px;
}

.leg.right:after {
    right: -12px;
}

/* =========================
   PUNCH
========================= */

.jab .arm.right {

    animation: jabArm .2s;
}

.jab .glove.right {

    animation: jabGlove .2s;
}

@keyframes jabArm {

    0% {
        transform: rotate(-25deg);
    }

    50% {
        transform:
            rotate(-80deg)
            translateX(25px);
    }

    100% {
        transform: rotate(-25deg);
    }
}

@keyframes jabGlove {

    0% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(35px,-15px);
    }

    100% {
        transform: translate(0,0);
    }
}

/* =========================
   CROSS
========================= */

.cross .arm.right {

    animation: crossArm .25s;
}

.cross .glove.right {

    animation: crossGlove .25s;
}

@keyframes crossArm {

    0% {
        transform: rotate(-25deg);
    }

    50% {
        transform:
            rotate(-100deg)
            translateX(40px);
    }

    100% {
        transform: rotate(-25deg);
    }
}

@keyframes crossGlove {

    0% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(45px,-25px);
    }

    100% {
        transform: translate(0,0);
    }
}

/* =========================
   HEAVY
========================= */

.heavy .arm.right {

    animation: heavyArm .3s;
}

.heavy .glove.right {

    animation: heavyGlove .3s;
}

@keyframes heavyArm {

    0% {
        transform: rotate(-25deg);
    }

    50% {
        transform:
            rotate(-125deg)
            translateX(45px);
    }

    100% {
        transform: rotate(-25deg);
    }
}

@keyframes heavyGlove {

    0% {
        transform: translate(0,0);
    }

    50% {
        transform:
            translate(55px,-35px)
            scale(1.1);
    }

    100% {
        transform: translate(0,0);
    }
}

/* =========================
   BLOCK
========================= */

.block .arm.left {
    transform: rotate(-60deg);
}

.block .arm.right {
    transform: rotate(60deg);
}

.block .glove.left {
    transform: translate(10px,-20px);
}

.block .glove.right {
    transform: translate(-10px,-20px);
}

/* =========================
   HIT
========================= */

.hit {

    animation: hit .2s;
}

@keyframes hit {

    0% {
        transform: translateX(0);
    }

    30% {
        transform: translateX(18px);
    }

    60% {
        transform: translateX(-10px);
    }

    100% {
        transform: translateX(0);
    }
}

/* =========================
   JUMP
========================= */

.jump {

    transform: translateY(-100px);
}

/* =========================
   MESSAGE
========================= */

#message {

    position: absolute;

    left: 50%;
    top: 32%;

    transform: translateX(-50%);

    z-index: 150;

    font-size: 45px;

    font-weight: 1000;

    text-shadow:
        4px 4px #000;

    pointer-events: none;

    opacity: 0;
}

.messageShow {

    animation: message .7s;
}

@keyframes message {

    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.5);
    }

    30% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1.2);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   IMPACT
========================= */

#impact {

    position: absolute;

    z-index: 200;

    font-size: 60px;

    display: none;

    pointer-events: none;
}

/* =========================
   CONTROLS
========================= */

#controls {

    position: absolute;

    bottom: 1.5%;

    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 8px 15px;

    background: rgba(0,0,0,.8);

    border: 1px solid #555;

    border-radius: 5px;

    font-size: 12px;

    color: #ddd;

    white-space: nowrap;
}

/* =========================
   START SCREEN
========================= */

#startScreen,
#gameOver {

    position: absolute;

    inset: 0;

    z-index: 500;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            #262b46,
            #05060b 75%
        );
}

#gameOver {
    display: none;
}

.overlayTitle {

    font-size: clamp(
        45px,
        8vw,
        90px
    );

    font-weight: 1000;

    letter-spacing: 5px;

    text-shadow:
        5px 5px #000,
        0 0 25px #ef233c;
}

.overlayTitle span {
    color: #ef233c;
}

.subtitle {

    margin-top: 10px;

    color: #b9bed0;

    letter-spacing: 3px;
}

button {

    margin-top: 30px;

    padding: 15px 45px;

    border: none;

    border-radius: 5px;

    background:
        linear-gradient(
            #ff4057,
            #c81632
        );

    color: white;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 2px;

    cursor: pointer;
}

button:hover {

    transform: scale(1.04);
}

</style>
</head>

<body>

<div id="game">

    <!-- LIGHTS -->

    <div class="light light1"></div>
    <div class="light light2"></div>
    <div class="light light3"></div>


    <!-- TITLE -->

    <div id="title">
        BOBBY <span>BOXING</span>
    </div>


    <!-- PLAYER HUD -->

    <div
        id="playerHUD"
        class="hud">

        <div class="name">
            BOBBY
        </div>

        <div class="bar">
            <div
                id="playerHealth"
                class="fill health">
            </div>
        </div>

        <div class="bar">
            <div
                id="playerStamina"
                class="fill stamina">
            </div>
        </div>

    </div>


    <!-- ENEMY HUD -->

    <div
        id="enemyHUD"
        class="hud">

        <div class="name">
            VENOM
        </div>

        <div class="bar">
            <div
                id="enemyHealth"
                class="fill health">
            </div>
        </div>

        <div class="bar">
            <div
                id="enemyStamina"
                class="fill stamina">
            </div>
        </div>

    </div>


    <!-- ROUND -->

    <div id="round">

        <div id="roundNumber">
            ROUND 1
        </div>

        <div id="time">
            60
        </div>

    </div>


    <!-- CROWD -->

    <div id="crowd">
        ● ● ● ● ● ● ● ● ● ● ● ● ● ● ●
    </div>


    <!-- RING -->

    <div id="ring">

        <div class="rope rope1"></div>
        <div class="rope rope2"></div>
        <div class="rope rope3"></div>

        <div class="post left"></div>
        <div class="post right"></div>


        <!-- BOBBY -->

        <div
            id="bobby"
            class="fighter"
            style="left:20%;">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="glove left"></div>
            <div class="glove right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>


        <!-- VENOM -->

        <div
            id="venom"
            class="fighter"
            style="left:70%;">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="glove left"></div>
            <div class="glove right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>

    </div>


    <!-- MESSAGE -->

    <div id="message">
        FIGHT!
    </div>


    <!-- IMPACT -->

    <div id="impact">
        💥
    </div>


    <!-- CONTROLS -->

    <div id="controls">

        A / D = MOVE
        &nbsp; | &nbsp;
        W = JUMP
        &nbsp; | &nbsp;
        J = JAB
        &nbsp; | &nbsp;
        K = CROSS
        &nbsp; | &nbsp;
        L = HEAVY
        &nbsp; | &nbsp;
        S = BLOCK

    </div>


    <!-- START -->

    <div id="startScreen">

        <div class="overlayTitle">
            BOBBY <span>BOXING</span>
        </div>

        <div class="subtitle">
            ROUND 1 • FIGHT NIGHT
        </div>

        <button id="startButton">
            ENTER THE RING
        </button>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <div
            id="result"
            class="overlayTitle">
            BOBBY <span>WINS!</span>
        </div>

        <div
            id="resultSub"
            class="subtitle">
            FIGHT OVER
        </div>

        <button
            onclick="location.reload()">
            REMATCH
        </button>

    </div>

</div>


<script>

/* =====================================
   GET ELEMENTS
===================================== */

const bobby =
    document.getElementById("bobby");

const venom =
    document.getElementById("venom");

const playerHealth =
    document.getElementById("playerHealth");

const enemyHealth =
    document.getElementById("enemyHealth");

const playerStamina =
    document.getElementById("playerStamina");

const enemyStamina =
    document.getElementById("enemyStamina");

const timeDisplay =
    document.getElementById("time");

const message =
    document.getElementById("message");

const impact =
    document.getElementById("impact");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const gameOver =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultSub =
    document.getElementById("resultSub");


/* =====================================
   VARIABLES
===================================== */

let gameRunning = false;

let playerHP = 100;
let venomHP = 100;

let playerSP = 100;
let venomSP = 100;

let playerX = 20;
let venomX = 70;

let seconds = 60;

let blocking = false;
let jumping = false;


/* =====================================
   START
===================================== */

startButton.addEventListener(
    "click",
    startGame
);

function startGame() {

    startScreen.style.display =
        "none";

    gameRunning = true;

    showMessage("FIGHT!");

    startTimer();

    startAI();
}


/* =====================================
   KEYBOARD
===================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (!gameRunning)
            return;

        let key =
            e.key.toLowerCase();

        if (key === "a")
            move(-2);

        if (key === "d")
            move(2);

        if (key === "w")
            jump();

        if (key === "j")
            attack("jab");

        if (key === "k")
            attack("cross");

        if (key === "l")
            attack("heavy");

        if (key === "s")
            block();

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key.toLowerCase() === "s"
        ) {

            unblock();

        }

    }
);


/* =====================================
   MOVEMENT
===================================== */

function move(amount) {

    if (blocking)
        return;

    playerX += amount;

    if (playerX < 7)
        playerX = 7;

    if (playerX > 85)
        playerX = 85;

    bobby.style.left =
        playerX + "%";
}


/* =====================================
   JUMP
===================================== */

function jump() {

    if (jumping)
        return;

    jumping = true;

    bobby.classList.add(
        "jump"
    );

    setTimeout(
        function() {

            bobby.classList.remove(
                "jump"
            );

            jumping = false;

        },
        450
    );

}


/* =====================================
   BLOCK
===================================== */

function block() {

    blocking = true;

    bobby.classList.add(
        "block"
    );

}


function unblock() {

    blocking = false;

    bobby.classList.remove(
        "block"
    );

}


/* =====================================
   ATTACK
===================================== */

function attack(type) {

    if (blocking)
        return;

    let damage = 0;
    let cost = 0;

    if (type === "jab") {

        damage = 7;
        cost = 5;

    }

    if (type === "cross") {

        damage = 12;
        cost = 9;

    }

    if (type === "heavy") {

        damage = 20;
        cost = 18;

    }


    if (playerSP < cost) {

        showMessage("TIRED!");

        return;

    }


    playerSP -= cost;

    updateBars();


    bobby.classList.remove(
        "jab",
        "cross",
        "heavy"
    );

    void bobby.offsetWidth;

    bobby.classList.add(
        type
    );


    setTimeout(
        function() {

            bobby.classList.remove(
                type
            );

        },
        350
    );


    let distance =
        Math.abs(
            playerX - venomX
        );


    if (distance < 24) {

        hitVenom(damage);

    }
    else {

        showMessage("MISS");

    }

}


/* =====================================
   HIT VENOM
===================================== */

function hitVenom(damage) {

    venomHP -= damage;

    if (venomHP < 0)
        venomHP = 0;

    enemyHealth.style.width =
        venomHP + "%";


    venom.classList.add(
        "hit"
    );

    showMessage(
        damage >= 18
            ? "HEAVY HIT!"
            : "HIT!"
    );

    showImpact();


    setTimeout(
        function() {

            venom.classList.remove(
                "hit"
            );

        },
        250
    );


    if (venomHP <= 0) {

        win();

    }

}


/* =====================================
   VENOM AI
===================================== */

function startAI() {

    setInterval(
        function() {

            if (!gameRunning)
                return;


            let distance =
                Math.abs(
                    venomX - playerX
                );


            if (distance > 18) {

                if (
                    venomX > playerX
                ) {

                    venomX -= 1;

                }
                else {

                    venomX += 1;

                }

                venom.style.left =
                    venomX + "%";

            }


            if (
                distance < 22 &&
                Math.random() < .35
            ) {

                venomAttack();

            }

        },
        500
    );

}


/* =====================================
   VENOM ATTACK
===================================== */

function venomAttack() {

    if (venomSP < 8)
        return;

    venomSP -= 8;


    let damage =
        Math.random() < .2
            ? 15
            : 8;


    if (jumping) {

        showMessage("DODGED!");

        return;

    }


    if (blocking) {

        damage =
            Math.floor(
                damage * .2
            );

        showMessage("BLOCKED!");

    }
    else {

        showMessage(
            "VENOM HIT!"
        );

        bobby.classList.add(
            "hit"
        );

        setTimeout(
            function() {

                bobby.classList.remove(
                    "hit"
                );

            },
            250
        );

    }


    playerHP -= damage;

    if (playerHP < 0)
        playerHP = 0;


    updateBars();


    if (playerHP <= 0) {

        lose();

    }

}


/* =====================================
   STAMINA
===================================== */

setInterval(
    function() {

        if (!gameRunning)
            return;

        playerSP += 2;
        venomSP += 3;

        if (playerSP > 100)
            playerSP = 100;

        if (venomSP > 100)
            venomSP = 100;

        updateBars();

    },
    500
);


/* =====================================
   BARS
===================================== */

function updateBars() {

    playerHealth.style.width =
        playerHP + "%";

    enemyHealth.style.width =
        venomHP + "%";

    playerStamina.style.width =
        playerSP + "%";

    enemyStamina.style.width =
        venomSP + "%";

}


/* =====================================
   TIMER
===================================== */

function startTimer() {

    let interval =
        setInterval(
            function() {

                if (!gameRunning) {

                    clearInterval(interval);

                    return;

                }


                seconds--;

                timeDisplay.innerText =
                    seconds;


                if (seconds <= 10) {

                    timeDisplay.style.color =
                        "#ef233c";

                }


                if (seconds <= 0) {

                    clearInterval(interval);

                    pointsResult();

                }

            },
            1000
        );

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    message.innerText =
        text;

    message.classList.remove(
        "messageShow"
    );

    void message.offsetWidth;

    message.classList.add(
        "messageShow"
    );

}


/* =====================================
   IMPACT
===================================== */

function showImpact() {

    impact.style.display =
        "block";

    impact.style.left =
        (50 + Math.random() * 10)
        + "%";

    impact.style.top =
        (35 + Math.random() * 15)
        + "%";

    setTimeout(
        function() {

            impact.style.display =
                "none";

        },
        250
    );

}


/* =====================================
   WIN
===================================== */

function win() {

    gameRunning = false;

    result.innerHTML =
        'BOBBY <span>WINS!</span>';

    resultSub.innerText =
        "VENOM HAS BEEN KNOCKED OUT";

    gameOver.style.display =
        "flex";

}


/* =====================================
   LOSE
===================================== */

function lose() {

    gameRunning = false;

    result.innerHTML =
        'VENOM <span>WINS!</span>';

    resultSub.innerText =
        "BOBBY HAS BEEN KNOCKED OUT";

    gameOver.style.display =
        "flex";

}


/* =====================================
   TIME RESULT
===================================== */

function pointsResult() {

    gameRunning = false;

    if (playerHP > venomHP) {

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultSub.innerText =
            "WIN BY POINTS";

    }
    else if (venomHP > playerHP) {

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultSub.innerText =
            "VENOM WINS BY POINTS";

    }
    else {

        result.innerHTML =
            "DRAW";

        resultSub.innerText =
            "WHAT A FIGHT!";

    }

    gameOver.style.display =
        "flex";

}


/* =====================================
   INITIAL
===================================== */

updateBars();

</script>
