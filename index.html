<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobby Boxing 🥊</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: linear-gradient(#252545, #111122);
    overflow: hidden;
}

/* Lights */
.light {
    position: absolute;
    width: 180px;
    height: 300px;
    background: linear-gradient(
        rgba(255,255,255,0.15),
        transparent
    );
    transform: rotate(15deg);
}

.light1 { left: 10%; top: 0; }
.light2 { right: 10%; top: 0; transform: rotate(-15deg); }

/* Crowd */
#crowd {
    position: absolute;
    top: 8%;
    width: 100%;
    text-align: center;
    font-size: 40px;
    letter-spacing: 15px;
}

/* Title */
#title {
    position: absolute;
    top: 3%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 0 0 15px #ff3030;
}

/* Ring */
#ring {
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: 8%;
    height: 55%;
    background: #ddd;
    border: 12px solid #222;
    box-shadow: 0 0 30px black;
}

.rope {
    position: absolute;
    left: -12px;
    right: -12px;
    height: 8px;
    background: #e63946;
}

.rope1 { top: 20%; }
.rope2 { top: 40%; }
.rope3 { top: 60%; }

.corner {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 20px;
    background: #222;
}

.corner.left { left: 5%; }
.corner.right { right: 5%; }

/* Floor */
#floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 40%;
    background:
        repeating-linear-gradient(
            45deg,
            #eeeeee,
            #eeeeee 20px,
            #dddddd 20px,
            #dddddd 40px
        );
}

/* Fighters */
.fighter {
    position: absolute;
    bottom: 12%;
    width: 90px;
    height: 180px;
    transition: transform 0.08s;
}

/* Bobby */
#bobby {
    left: 25%;
}

/* Enemy */
#enemy {
    right: 25%;
    transform: scaleX(-1);
}

/* Head */
.head {
    position: absolute;
    top: 0;
    left: 25px;
    width: 40px;
    height: 40px;
    background: #d99b6c;
    border-radius: 50%;
    border: 4px solid #111;
}

/* Hair */
.head::before {
    content: "";
    position: absolute;
    top: -5px;
    left: 3px;
    width: 32px;
    height: 15px;
    background: #222;
    border-radius: 50% 50% 0 0;
}

/* Body */
.body {
    position: absolute;
    top: 38px;
    left: 20px;
    width: 50px;
    height: 75px;
    background: #1d4ed8;
    border: 4px solid #111;
    border-radius: 15px;
}

/* Arms */
.arm {
    position: absolute;
    width: 25px;
    height: 65px;
    background: #d99b6c;
    border: 4px solid #111;
    border-radius: 20px;
    top: 45px;
}

.left-arm {
    left: 0;
    transform: rotate(25deg);
}

.right-arm {
    right: 0;
    transform: rotate(-25deg);
}

/* Gloves */
.glove {
    position: absolute;
    width: 32px;
    height: 32px;
    background: #e11d48;
    border: 4px solid #111;
    border-radius: 50%;
}

.left-glove {
    left: -10px;
    top: 92px;
}

.right-glove {
    right: -10px;
    top: 92px;
}

/* Legs */
.leg {
    position: absolute;
    width: 25px;
    height: 70px;
    background: #111827;
    border: 4px solid #111;
    top: 105px;
}

.left-leg {
    left: 22px;
    transform: rotate(5deg);
}

.right-leg {
    right: 22px;
    transform: rotate(-5deg);
}

/* Health */
.health-container {
    position: absolute;
    top: 14%;
    width: 30%;
    height: 28px;
    background: #333;
    border: 4px solid white;
}

#playerHealthBox {
    left: 5%;
}

#enemyHealthBox {
    right: 5%;
}

.health {
    height: 100%;
    background: #22c55e;
    width: 100%;
    transition: width 0.2s;
}

.name {
    color: white;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 5px;
}

/* Messages */
#message {
    position: absolute;
    top: 22%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 35px;
    font-weight: bold;
    text-shadow: 0 0 10px black;
}

/* Controls */
#controls {
    position: absolute;
    bottom: 2%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 17px;
}

/* Punch animation */
.punch {
    transform: translateX(30px) rotate(-10deg);
}

/* Enemy hit */
.hit {
    animation: hit 0.15s;
}

@keyframes hit {
    0% { transform: translateX(0); }
    50% { transform: translateX(20px); }
    100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div id="game">

    <div class="light light1"></div>
    <div class="light light2"></div>

    <div id="title">🥊 BOBBY BOXING 🥊</div>

    <div id="crowd">👤 👤 👤 👤 👤 👤 👤 👤 👤</div>

    <!-- Health -->
    <div id="playerHealthBox" class="health-container">
        <div class="name">BOBBY</div>
        <div id="playerHealth" class="health"></div>
    </div>

    <div id="enemyHealthBox" class="health-container">
        <div class="name">VENOM</div>
        <div id="enemyHealth" class="health"></div>
    </div>

    <div id="message">FIGHT! 🥊</div>

    <!-- Ring -->
    <div id="ring">

        <div id="floor"></div>

        <div class="rope rope1"></div>
        <div class="rope rope2"></div>
        <div class="rope rope3"></div>

        <div class="corner left"></div>
        <div class="corner right"></div>

        <!-- Bobby -->
        <div id="bobby" class="fighter">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="glove left-glove"></div>
            <div class="glove right-glove"></div>

            <div class="leg left-leg"></div>
            <div class="leg right-leg"></div>

        </div>

        <!-- Enemy -->
        <div id="enemy" class="fighter">

            <div class="head"></div>

            <div class="body" style="background:#111;"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="glove left-glove" style="background:#000;"></div>
            <div class="glove right-glove" style="background:#000;"></div>

            <div class="leg left-leg"></div>
            <div class="leg right-leg"></div>

        </div>

    </div>

    <div id="controls">
        A / D = Move &nbsp; | &nbsp;
        W = Jump &nbsp; | &nbsp;
        J = Jab 👊 &nbsp; | &nbsp;
        K = Heavy Punch 💥 &nbsp; | &nbsp;
        L = Block 🛡️
    </div>

</div>

<script>

const bobby = document.getElementById("bobby");
const enemy = document.getElementById("enemy");

const playerHealth = document.getElementById("playerHealth");
const enemyHealth = document.getElementById("enemyHealth");
const message = document.getElementById("message");

let playerHP = 100;
let enemyHP = 100;

let playerX = 25;
let enemyX = 70;

let jumping = false;
let blocking = false;
let gameOver = false;

/* Keyboard Controls */

document.addEventListener("keydown", function(event) {

    if (gameOver) return;

    const key = event.key.toLowerCase();

    /* Move Left */

    if (key === "a") {

        playerX -= 2;

        if (playerX < 5)
            playerX = 5;

        bobby.style.left = playerX + "%";
    }

    /* Move Right */

    if (key === "d") {

        playerX += 2;

        if (playerX > 80)
            playerX = 80;

        bobby.style.left = playerX + "%";
    }

    /* Jump */

    if (key === "w" && !jumping) {

        jumping = true;

        bobby.style.bottom = "35%";

        setTimeout(() => {

            bobby.style.bottom = "12%";

            jumping = false;

        }, 400);
    }

    /* Jab */

    if (key === "j") {

        punch(8);

    }

    /* Heavy Punch */

    if (key === "k") {

        punch(15);

    }

    /* Block */

    if (key === "l") {

        blocking = true;

        message.innerText = "🛡️ BLOCK!";

    }

});


document.addEventListener("keyup", function(event) {

    if (event.key.toLowerCase() === "l") {

        blocking = false;

        message.innerText = "FIGHT! 🥊";

    }

});


/* Punch Function */

function punch(damage) {

    if (gameOver) return;

    bobby.classList.add("punch");

    setTimeout(() => {

        bobby.classList.remove("punch");

    }, 150);

    /* Check distance */

    const distance = Math.abs(playerX - enemyX);

    if (distance < 25) {

        enemyHP -= damage;

        if (enemyHP < 0)
            enemyHP = 0;

        enemyHealth.style.width = enemyHP + "%";

        enemy.classList.add("hit");

        setTimeout(() => {

            enemy.classList.remove("hit");

        }, 150);

        message.innerText = damage >= 15
            ? "💥 HEAVY HIT!"
            : "👊 JAB!";

        if (enemyHP <= 0) {

            winGame();

        }

    }

}


/* Enemy AI */

setInterval(function() {

    if (gameOver) return;

    /* Move toward Bobby */

    if (enemyX > playerX + 15) {

        enemyX -= 1;

    }
    else if (enemyX < playerX - 15) {

        enemyX += 1;

    }

    enemy.style.right = (100 - enemyX) + "%";

    /* Enemy attack */

    const distance = Math.abs(playerX - enemyX);

    if (distance < 18 && Math.random() < 0.25) {

        if (!blocking) {

            playerHP -= 8;

            if (playerHP < 0)
                playerHP = 0;

            playerHealth.style.width = playerHP + "%";

            message.innerText = "💥 BOBBY GOT HIT!";

            if (playerHP <= 0) {

                loseGame();

            }

        }
        else {

            message.innerText = "🛡️ BLOCKED!";

        }

    }

}, 500);


/* Win */

function winGame() {

    gameOver = true;

    message.innerText = "🏆 BOBBY WINS! 🥊🔥";

    setTimeout(() => {

        message.innerText += "  Press R to Restart";

    }, 1000);

}


/* Lose */

function loseGame() {

    gameOver = true;

    message.innerText = "💀 BOBBY GOT KO'D!";

}


/* Restart */

document.addEventListener("keydown", function(event) {

    if (event.key.toLowerCase() === "r") {

        location.reload();

    }

});

</script>

</body>
</html>
