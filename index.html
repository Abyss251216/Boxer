<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Bobby Boxing — V6</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#05070d;
    color:#fff;
    user-select:none;
}


/* =========================================================
   GAME ROOT
========================================================= */

#game{
    position:relative;

    width:100vw;
    height:100vh;

    min-height:600px;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            #39405d 0%,
            #20243a 35%,
            #0c0f1d 72%,
            #04050a 100%
        );

    transition:
        transform .08s linear;
}


/* =========================================================
   ARENA LIGHTS
========================================================= */

.arenaLight{
    position:absolute;

    top:-180px;

    width:230px;
    height:700px;

    opacity:.13;

    filter:blur(25px);

    background:#fff;

    transform:rotate(17deg);

    pointer-events:none;
}

.arenaLight.left{
    left:8%;
}

.arenaLight.center{
    left:50%;

    transform:
        translateX(-50%)
        rotate(0deg);

    opacity:.18;
}

.arenaLight.right{
    right:8%;

    transform:rotate(-17deg);
}


/* =========================================================
   TITLE
========================================================= */

#title{
    position:absolute;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    z-index:200;

    white-space:nowrap;

    font-size:
        clamp(25px,4vw,55px);

    font-weight:1000;

    letter-spacing:4px;

    text-shadow:
        4px 4px 0 #000,
        0 0 18px rgba(255,40,70,.55);
}

#title span{
    color:#ff304f;
}


/* =========================================================
   HUD
========================================================= */

.hud{
    position:absolute;

    top:23px;

    width:30%;

    z-index:210;
}

#playerHud{
    left:2.5%;
}

#enemyHud{
    right:2.5%;
}

.fighterName{
    margin-bottom:6px;

    font-size:18px;

    font-weight:1000;

    letter-spacing:1px;
}

#enemyHud .fighterName{
    text-align:right;
}

.healthOuter,
.staminaOuter{
    width:100%;

    height:18px;

    overflow:hidden;

    border:2px solid #fff;

    border-radius:4px;

    background:#08090d;

    box-shadow:
        0 3px 8px rgba(0,0,0,.6);
}

.healthOuter{
    margin-bottom:5px;
}

.healthBar,
.staminaBar{
    height:100%;

    width:100%;

    transition:
        width .16s ease;
}

.healthBar{
    background:
        linear-gradient(
            90deg,
            #0cb84d,
            #39f06b
        );
}

.staminaBar{
    background:
        linear-gradient(
            90deg,
            #0876d1,
            #2dbaff
        );
}


/* =========================================================
   ROUND / TIMER
========================================================= */

#roundInfo{
    position:absolute;

    top:58px;
    left:50%;

    transform:translateX(-50%);

    z-index:220;

    text-align:center;

    text-shadow:
        3px 3px #000;
}

#roundLabel{
    font-size:11px;

    letter-spacing:3px;

    font-weight:bold;
}

#timer{
    margin-top:1px;

    font-size:34px;

    font-weight:1000;
}

#timer.danger{
    color:#ff304d;

    animation:
        timerPulse .45s
        infinite alternate;
}

@keyframes timerPulse{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.14);
    }
}


/* =========================================================
   CROWD
========================================================= */

#crowd{
    position:absolute;

    top:120px;
    left:0;

    width:100%;

    z-index:2;

    text-align:center;

    color:#454a67;

    font-size:30px;

    letter-spacing:9px;

    opacity:.65;
}


/* =========================================================
   RING
========================================================= */

#ring{
    position:absolute;

    left:4%;
    right:4%;

    bottom:8%;

    height:62%;

    overflow:hidden;

    border:
        11px solid #07090e;

    background:
        linear-gradient(
            180deg,
            #dfe3e8,
            #bfc4cb
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.85);

    perspective:900px;
}


/* =========================================================
   RING FLOOR
========================================================= */

#ringFloor{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:27%;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,.08) 0px,
            rgba(0,0,0,.08) 2px,
            transparent 2px,
            transparent 75px
        ),
        linear-gradient(
            rgba(255,255,255,.25),
            rgba(0,0,0,.15)
        );

    transform:
        perspective(500px)
        rotateX(8deg);

    transform-origin:bottom;

    z-index:4;
}


/* =========================================================
   ROPES
========================================================= */

.rope{
    position:absolute;

    left:0;
    right:0;

    height:7px;

    background:
        linear-gradient(
            #ff5267,
            #c81635
        );

    border-top:1px solid rgba(255,255,255,.4);

    border-bottom:1px solid #640719;

    box-shadow:
        0 3px 5px rgba(0,0,0,.5);

    z-index:12;
}

.rope.one{
    top:20%;
}

.rope.two{
    top:45%;
}

.rope.three{
    top:70%;
}


/* =========================================================
   POSTS
========================================================= */

.post{
    position:absolute;

    top:-15px;
    bottom:-15px;

    width:30px;

    z-index:20;

    background:
        linear-gradient(
            90deg,
            #020305,
            #30333b,
            #050609
        );

    box-shadow:
        4px 0 8px rgba(0,0,0,.5);
}

.post.left{
    left:4%;
}

.post.right{
    right:4%;
}


/* =========================================================
   FIGHTER
========================================================= */

.fighter{
    position:absolute;

    width:175px;
    height:270px;

    bottom:15%;

    z-index:30;

    transition:
        left .08s linear;

    transform-origin:
        center bottom;
}


/* =========================================================
   CHARACTER IMAGE
========================================================= */

.characterImage{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;

    filter:
        drop-shadow(
            0 14px 8px rgba(0,0,0,.35)
        );
}


/* =========================================================
   BOBBY
========================================================= */

#bobby{
    left:19%;
}


/* =========================================================
   VENOM
========================================================= */

#venom{
    left:69%;

    transform:
        scaleX(-1);
}


/* =========================================================
   ATTACK STATES
========================================================= */

.fighter.jab{
    animation:
        jabAnimation .22s ease;
}

.fighter.cross{
    animation:
        crossAnimation .28s ease;
}

.fighter.heavy{
    animation:
        heavyAnimation .38s ease;
}

@keyframes jabAnimation{

    0%{
        transform:
            translateX(0)
            scale(1);
    }

    45%{
        transform:
            translateX(26px)
            scale(1.03);
    }

    100%{
        transform:
            translateX(0)
            scale(1);
    }
}

@keyframes crossAnimation{

    0%{
        transform:
            translateX(0)
            scale(1);
    }

    45%{
        transform:
            translateX(39px)
            scale(1.04);
    }

    100%{
        transform:
            translateX(0)
            scale(1);
    }
}

@keyframes heavyAnimation{

    0%{
        transform:
            translateX(0)
            scale(1);
    }

    35%{
        transform:
            translateX(28px)
            translateY(-5px)
            scale(1.07);
    }

    55%{
        transform:
            translateX(45px)
            translateY(0)
            scale(1.09);
    }

    100%{
        transform:
            translateX(0)
            scale(1);
    }
}


/* =========================================================
   VENOM ATTACK TRANSFORM
========================================================= */

#venom.jab{
    animation:
        venomJab .22s ease;
}

#venom.cross{
    animation:
        venomCross .28s ease;
}

#venom.heavy{
    animation:
        venomHeavy .38s ease;
}

@keyframes venomJab{

    0%{
        transform:
            scaleX(-1)
            translateX(0);
    }

    45%{
        transform:
            scaleX(-1)
            translateX(26px);
    }

    100%{
        transform:
            scaleX(-1)
            translateX(0);
    }
}

@keyframes venomCross{

    0%{
        transform:
            scaleX(-1)
            translateX(0);
    }

    45%{
        transform:
            scaleX(-1)
            translateX(39px);
    }

    100%{
        transform:
            scaleX(-1)
            translateX(0);
    }
}

@keyframes venomHeavy{

    0%{
        transform:
            scaleX(-1)
            translateX(0);
    }

    45%{
        transform:
            scaleX(-1)
            translateX(45px)
            scale(1.08);
    }

    100%{
        transform:
            scaleX(-1)
            translateX(0);
    }
}


/* =========================================================
   BLOCK
========================================================= */

#bobby.block{
    transform:
        translateX(-10px)
        scale(.96);
}

#venom.block{
    transform:
        scaleX(-1)
        translateX(-10px)
        scale(.96);
}


/* =========================================================
   JUMP
========================================================= */

#bobby.jump{
    animation:
        jumpAnimation .48s ease;
}

#venom.jump{
    animation:
        venomJump .48s ease;
}

@keyframes jumpAnimation{

    0%{
        transform:
            translateY(0);
    }

    45%{
        transform:
            translateY(-105px)
            rotate(-3deg);
    }

    100%{
        transform:
            translateY(0);
    }
}

@keyframes venomJump{

    0%{
        transform:
            scaleX(-1)
            translateY(0);
    }

    45%{
        transform:
            scaleX(-1)
            translateY(-105px)
            rotate(3deg);
    }

    100%{
        transform:
            scaleX(-1)
            translateY(0);
    }
}


/* =========================================================
   DODGE
========================================================= */

#bobby.dodge{
    animation:
        dodge .3s ease;
}

@keyframes dodge{

    0%{
        transform:
            translateX(0);
    }

    50%{
        transform:
            translateX(-65px)
            rotate(-5deg);
    }

    100%{
        transform:
            translateX(0);
    }
}


/* =========================================================
   HIT REACTION
========================================================= */

.fighter.hit{
    animation:
        hitReaction .25s ease;
}

@keyframes hitReaction{

    0%{
        transform:
            translateX(0);
    }

    20%{
        transform:
            translateX(-20px)
            rotate(-4deg);
    }

    45%{
        transform:
            translateX(18px)
            rotate(4deg);
    }

    70%{
        transform:
            translateX(-10px);
    }

    100%{
        transform:
            translateX(0);
    }
}


/* =========================================================
   EFFECT LAYER
========================================================= */

#effects{
    position:absolute;

    inset:0;

    z-index:100;

    pointer-events:none;
}


/* =========================================================
   HIT SPARK
========================================================= */

.hitSpark{
    position:absolute;

    width:95px;
    height:95px;

    transform:
        translate(-50%,-50%);

    font-size:65px;

    animation:
        spark .42s ease forwards;
}

@keyframes spark{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.3)
            rotate(-20deg);
    }

    30%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.25)
            rotate(12deg);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.7)
            rotate(25deg);
    }
}


/* =========================================================
   COMBO
========================================================= */

#combo{
    position:absolute;

    top:22%;
    left:50%;

    transform:
        translateX(-50%);

    z-index:300;

    opacity:0;

    text-align:center;

    pointer-events:none;
}

#comboNumber{
    font-size:
        clamp(45px,6vw,78px);

    font-weight:1000;

    color:#ffd33d;

    text-shadow:
        4px 4px #000,
        0 0 25px #ff8a00;
}

#comboLabel{
    margin-top:-8px;

    font-size:15px;

    letter-spacing:5px;

    font-weight:1000;
}

.comboShow{
    animation:
        comboPop .7s ease;
}

@keyframes comboPop{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            scale(.35);
    }

    25%{
        opacity:1;

        transform:
            translateX(-50%)
            scale(1.25);
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =========================================================
   FIGHT MESSAGE
========================================================= */

#message{
    position:absolute;

    left:50%;
    top:35%;

    z-index:320;

    transform:
        translateX(-50%);

    opacity:0;

    font-size:
        clamp(38px,6vw,70px);

    font-weight:1000;

    letter-spacing:3px;

    white-space:nowrap;

    text-shadow:
        5px 5px #000,
        0 0 20px rgba(255,255,255,.35);

    pointer-events:none;
}

.messageShow{
    animation:
        messagePop .65s ease;
}

@keyframes messagePop{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            scale(.3);
    }

    25%{
        opacity:1;

        transform:
            translateX(-50%)
            scale(1.25);
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =========================================================
   SCREEN SHAKE
========================================================= */

.shake{
    animation:
        screenShake .2s ease;
}

@keyframes screenShake{

    0%{
        transform:translate(0);
    }

    20%{
        transform:translate(7px,-4px);
    }

    40%{
        transform:translate(-8px,5px);
    }

    60%{
        transform:translate(5px,2px);
    }

    80%{
        transform:translate(-3px,-2px);
    }

    100%{
        transform:translate(0);
    }
}


/* =========================================================
   CONTROLS
========================================================= */

#controls{
    position:absolute;

    left:50%;
    bottom:1.3%;

    transform:
        translateX(-50%);

    z-index:250;

    padding:
        8px 15px;

    border:
        1px solid #555b72;

    border-radius:6px;

    background:
        rgba(0,0,0,.78);

    color:#dce0ef;

    font-size:11px;

    letter-spacing:.5px;

    white-space:nowrap;
}


/* =========================================================
   MOBILE CONTROLS
========================================================= */

#mobileControls{
    display:none;

    position:absolute;

    left:12px;
    right:12px;
    bottom:14px;

    z-index:500;

    justify-content:
        space-between;

    pointer-events:none;
}

.mobileGroup{
    display:flex;

    gap:7px;
}

.mobileButton{
    width:49px;
    height:49px;

    border:
        2px solid #fff;

    border-radius:50%;

    background:
        rgba(0,0,0,.7);

    color:#fff;

    font-size:15px;

    font-weight:1000;

    pointer-events:auto;

    touch-action:none;
}


/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #2b3150 0%,
            #0a0c15 70%,
            #020308 100%
        );
}

#gameOver{
    display:none;
}

.overlayTitle{
    font-size:
        clamp(42px,8vw,95px);

    font-weight:1000;

    letter-spacing:4px;

    text-shadow:
        5px 5px #000,
        0 0 30px rgba(255,35,65,.7);
}

.overlayTitle span{
    color:#ff304f;
}

.overlaySubtitle{
    margin-top:12px;

    color:#bfc4d8;

    letter-spacing:4px;

    font-size:14px;
}

.mainButton{
    margin-top:30px;

    padding:
        15px 48px;

    border:0;

    border-radius:5px;

    cursor:pointer;

    color:#fff;

    background:
        linear-gradient(
            #ff405c,
            #c71735
        );

    font-size:16px;

    font-weight:1000;

    letter-spacing:2px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5);

    transition:
        transform .15s ease;
}

.mainButton:hover{
    transform:
        scale(1.06);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    #title{
        top:5px;

        font-size:23px;

        letter-spacing:2px;
    }

    .hud{
        top:40px;

        width:39%;
    }

    #roundInfo{
        top:72px;
    }

    #crowd{
        top:130px;

        font-size:17px;

        letter-spacing:3px;
    }

    #ring{
        left:2%;
        right:2%;

        bottom:14%;

        height:56%;

        border-width:8px;
    }

    .fighter{
        width:125px;
        height:205px;
    }

    #controls{
        display:none;
    }

    #mobileControls{
        display:flex;
    }

    #message{
        top:36%;
    }

}

</style>
</head>


<body>

<div id="game">

    <!-- ARENA LIGHTS -->

    <div class="arenaLight left"></div>
    <div class="arenaLight center"></div>
    <div class="arenaLight right"></div>


    <!-- TITLE -->

    <div id="title">
        BOBBY <span>BOXING</span>
    </div>


    <!-- PLAYER HUD -->

    <div
        id="playerHud"
        class="hud">

        <div class="fighterName">
            🥊 BOBBY
        </div>

        <div class="healthOuter">
            <div
                id="playerHealth"
                class="healthBar">
            </div>
        </div>

        <div class="staminaOuter">
            <div
                id="playerStamina"
                class="staminaBar">
            </div>
        </div>

    </div>


    <!-- ENEMY HUD -->

    <div
        id="enemyHud"
        class="hud">

        <div class="fighterName">
            VENOM 🖤
        </div>

        <div class="healthOuter">
            <div
                id="enemyHealth"
                class="healthBar">
            </div>
        </div>

        <div class="staminaOuter">
            <div
                id="enemyStamina"
                class="staminaBar">
            </div>
        </div>

    </div>


    <!-- ROUND -->

    <div id="roundInfo">

        <div id="roundLabel">
            ROUND 1
        </div>

        <div id="timer">
            60
        </div>

    </div>


    <!-- CROWD -->

    <div id="crowd">
        ● ● ● ● ● ● ● ● ● ● ● ● ●
    </div>


    <!-- RING -->

    <div id="ring">

        <div class="rope one"></div>
        <div class="rope two"></div>
        <div class="rope three"></div>

        <div class="post left"></div>
        <div class="post right"></div>

        <div id="ringFloor"></div>


        <!-- BOBBY -->

        <div
            id="bobby"
            class="fighter">

            <img
                class="characterImage"
                src="assets/bobby.svg"
                alt="Bobby">

        </div>


        <!-- VENOM -->

        <div
            id="venom"
            class="fighter">

            <img
                class="characterImage"
                src="assets/venom.svg"
                alt="Venom">

        </div>

    </div>


    <!-- EFFECTS -->

    <div id="effects"></div>


    <!-- COMBO -->

    <div id="combo">

        <div id="comboNumber">
            0
        </div>

        <div id="comboLabel">
            HIT COMBO
        </div>

    </div>


    <!-- MESSAGE -->

    <div id="message">
        FIGHT!
    </div>


    <!-- CONTROLS -->

    <div id="controls">

        A / D MOVE
        &nbsp; • &nbsp;
        W JUMP
        &nbsp; • &nbsp;
        J JAB
        &nbsp; • &nbsp;
        K CROSS
        &nbsp; • &nbsp;
        L HEAVY
        &nbsp; • &nbsp;
        S BLOCK
        &nbsp; • &nbsp;
        SPACE DASH

    </div>


    <!-- MOBILE -->

    <div id="mobileControls">

        <div class="mobileGroup">

            <button
                class="mobileButton"
                data-key="a">
                ◀
            </button>

            <button
                class="mobileButton"
                data-key="d">
                ▶
            </button>

            <button
                class="mobileButton"
                data-key="w">
                ⬆
            </button>

        </div>

        <div class="mobileGroup">

            <button
                class="mobileButton"
                data-key="j">
                J
            </button>

            <button
                class="mobileButton"
                data-key="k">
                K
            </button>

            <button
                class="mobileButton"
                data-key="l">
                L
            </button>

            <button
                class="mobileButton"
                data-key="s">
                🛡
            </button>

        </div>

    </div>


    <!-- START SCREEN -->

    <div
        id="startScreen"
        class="overlay">

        <div class="overlayTitle">
            BOBBY <span>BOXING</span>
        </div>

        <div class="overlaySubtitle">
            V6 • FIGHT NIGHT
        </div>

        <button
            id="startButton"
            class="mainButton">
            ENTER THE RING
        </button>

    </div>


    <!-- GAME OVER -->

    <div
        id="gameOver"
        class="overlay">

        <div
            id="result"
            class="overlayTitle">
            BOBBY <span>WINS!</span>
        </div>

        <div
            id="resultSub"
            class="overlaySubtitle">
            KNOCKOUT!
        </div>

        <button
            id="rematch"
            class="mainButton">
            REMATCH
        </button>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const game =
    document.getElementById("game");

const bobby =
    document.getElementById("bobby");

const venom =
    document.getElementById("venom");

const playerHealth =
    document.getElementById("playerHealth");

const enemyHealth =
    document.getElementById("enemyHealth");

const playerStamina =
    document.getElementById("playerStamina");

const enemyStamina =
    document.getElementById("enemyStamina");

const timer =
    document.getElementById("timer");

const message =
    document.getElementById("message");

const combo =
    document.getElementById("combo");

const comboNumber =
    document.getElementById("comboNumber");

const effects =
    document.getElementById("effects");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const gameOver =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultSub =
    document.getElementById("resultSub");

const rematch =
    document.getElementById("rematch");


/* =========================================================
   STATE
========================================================= */

let running = false;

let playerHP = 100;
let enemyHP = 100;

let playerSP = 100;
let enemySP = 100;

let playerX = 19;
let enemyX = 69;

let timeLeft = 60;

let comboCount = 0;

let blocking = false;
let jumping = false;
let attacking = false;

let gameTimer = null;
let aiTimer = null;
let comboResetTimer = null;

let audioContext = null;


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);

rematch.addEventListener(
    "click",
    restartGame
);


function startGame(){

    running = true;

    startScreen.style.display =
        "none";

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    updateHUD();

    showMessage(
        "FIGHT!"
    );

    playSound(
        180,
        .18,
        "square"
    );

    startTimer();

    startAI();

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    location.reload();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(!running)
            return;

        if(event.repeat)
            return;

        const key =
            event.key.toLowerCase();


        if(key === "a")
            movePlayer(-3);


        if(key === "d")
            movePlayer(3);


        if(key === "w")
            jump();


        if(key === "j")
            attack("jab");


        if(key === "k")
            attack("cross");


        if(key === "l")
            attack("heavy");


        if(key === "s")
            blockStart();


        if(event.code === "Space"){

            event.preventDefault();

            dash();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        if(
            event.key.toLowerCase()
            === "s"
        ){

            blockStop();

        }

    }
);


/* =========================================================
   MOBILE
========================================================= */

document
.querySelectorAll(".mobileButton")
.forEach(button => {

    button.addEventListener(
        "touchstart",
        event => {

            event.preventDefault();

            mobileAction(
                button.dataset.key
            );

        },
        {
            passive:false
        }
    );

});


function mobileAction(key){

    if(!running)
        return;


    if(key === "a")
        movePlayer(-3);

    if(key === "d")
        movePlayer(3);

    if(key === "w")
        jump();

    if(key === "j")
        attack("jab");

    if(key === "k")
        attack("cross");

    if(key === "l")
        attack("heavy");

    if(key === "s")
        blockStart();

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(amount){

    if(
        blocking ||
        attacking ||
        !running
    )
        return;


    playerX += amount;

    playerX =
        Math.max(
            8,
            Math.min(
                83,
                playerX
            )
        );

    bobby.style.left =
        playerX + "%";

}


/* =========================================================
   DASH
========================================================= */

function dash(){

    if(
        !running ||
        blocking ||
        attacking ||
        playerSP < 15
    )
        return;


    playerSP -= 15;

    updateHUD();


    bobby.classList.add(
        "dodge"
    );


    playerX +=
        playerX < enemyX
            ? 8
            : -8;


    playerX =
        Math.max(
            8,
            Math.min(
                83,
                playerX
            )
        );


    bobby.style.left =
        playerX + "%";


    playSound(
        380,
        .08,
        "sine"
    );


    setTimeout(
        () => {

            bobby.classList.remove(
                "dodge"
            );

        },
        300
    );

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        jumping ||
        blocking ||
        attacking
    )
        return;


    jumping = true;

    bobby.classList.add(
        "jump"
    );


    setTimeout(
        () => {

            bobby.classList.remove(
                "jump"
            );

            jumping = false;

        },
        480
    );

}


/* =========================================================
   BLOCK
========================================================= */

function blockStart(){

    if(
        attacking ||
        jumping
    )
        return;


    blocking = true;

    bobby.classList.add(
        "block"
    );

}


function blockStop(){

    blocking = false;

    bobby.classList.remove(
        "block"
    );

}


/* =========================================================
   PLAYER ATTACK
========================================================= */

function attack(type){

    if(
        !running ||
        attacking ||
        blocking
    )
        return;


    let damage = 0;
    let staminaCost = 0;
    let duration = 220;


    if(type === "jab"){

        damage = 7;

        staminaCost = 4;

        duration = 220;

    }


    if(type === "cross"){

        damage = 11;

        staminaCost = 7;

        duration = 280;

    }


    if(type === "heavy"){

        damage = 20;

        staminaCost = 15;

        duration = 380;

    }


    if(
        playerSP <
        staminaCost
    ){

        showMessage(
            "TIRED!"
        );

        return;

    }


    playerSP -=
        staminaCost;

    updateHUD();

    attacking = true;


    bobby.classList.add(
        type
    );


    playSound(
        type === "heavy"
            ? 75
            : 145,
        .1,
        "square"
    );


    const distance =
        Math.abs(
            playerX - enemyX
        );


    if(distance < 24){

        hitEnemy(
            damage,
            type
        );

    }
    else{

        showMessage(
            "MISS!"
        );

    }


    setTimeout(
        () => {

            bobby.classList.remove(
                type
            );

            attacking = false;

        },
        duration
    );

}


/* =========================================================
   ENEMY HIT
========================================================= */

function hitEnemy(
    damage,
    type
){

    if(!running)
        return;


    /* AI block */

    if(
        Math.random() < .17
    ){

        showMessage(
            "BLOCKED!"
        );

        playSound(
            100,
            .1,
            "sawtooth"
        );

        return;

    }


    enemyHP -= damage;

    enemyHP =
        Math.max(
            0,
            enemyHP
        );


    enemySP =
        Math.max(
            0,
            enemySP - 4
        );


    updateHUD();


    venom.classList.add(
        "hit"
    );


    createImpact(
        venom,
        type === "heavy"
    );


    screenShake();


    comboCount++;

    showCombo();


    if(type === "heavy"){

        showMessage(
            "💥 HEAVY HIT!"
        );

        playSound(
            55,
            .15,
            "sawtooth"
        );

    }
    else{

        showMessage(
            "HIT!"
        );

        playSound(
            105,
            .12,
            "sawtooth"
        );

    }


    setTimeout(
        () => {

            venom.classList.remove(
                "hit"
            );

        },
        260
    );


    if(enemyHP <= 0){

        knockout(
            "BOBBY"
        );

    }

}


/* =========================================================
   IMPACT EFFECT
========================================================= */

function createImpact(
    target,
    heavy
){

    const spark =
        document.createElement(
            "div"
        );

    spark.className =
        "hitSpark";

    spark.innerText =
        heavy
            ? "💥"
            : "✦";


    const rect =
        target.getBoundingClientRect();


    spark.style.left =
        (
            rect.left +
            rect.width * .55
        ) + "px";


    spark.style.top =
        (
            rect.top +
            rect.height * .38
        ) + "px";


    effects.appendChild(
        spark
    );


    setTimeout(
        () => {

            spark.remove();

        },
        450
    );

}


/* =========================================================
   COMBO
========================================================= */

function showCombo(){

    comboNumber.innerText =
        comboCount;

    combo.classList.remove(
        "comboShow"
    );

    void combo.offsetWidth;

    combo.classList.add(
        "comboShow"
    );


    clearTimeout(
        comboResetTimer
    );


    comboResetTimer =
        setTimeout(
            () => {

                comboCount = 0;

            },
            1500
        );

}


/* =========================================================
   AI
========================================================= */

function startAI(){

    clearInterval(
        aiTimer
    );


    aiTimer =
        setInterval(
            () => {

                if(!running)
                    return;


                const distance =
                    Math.abs(
                        enemyX -
                        playerX
                    );


                /* Move toward Bobby */

                if(distance > 20){

                    if(
                        enemyX >
                        playerX
                    ){

                        enemyX -=
                            1.15;

                    }
                    else{

                        enemyX +=
                            1.15;

                    }


                    enemyX =
                        Math.max(
                            9,
                            Math.min(
                                82,
                                enemyX
                            )
                        );


                    venom.style.left =
                        enemyX + "%";

                }


                /* Attack */

                if(
                    distance < 23 &&
                    Math.random() < .43
                ){

                    enemyAttack();

                }


                /* Defensive movement */

                if(
                    Math.random() < .08
                ){

                    enemyX +=
                        enemyX >
                        playerX
                            ? 4
                            : -4;


                    enemyX =
                        Math.max(
                            9,
                            Math.min(
                                82,
                                enemyX
                            )
                        );


                    venom.style.left =
                        enemyX + "%";

                }

            },
            430
        );

}


/* =========================================================
   ENEMY ATTACK
========================================================= */

function enemyAttack(){

    if(
        enemySP < 7 ||
        !running
    )
        return;


    enemySP -= 7;

    updateHUD();


    const distance =
        Math.abs(
            enemyX -
            playerX
        );


    if(distance > 24)
        return;


    const attackType =
        Math.random() < .18
            ? "heavy"
            : Math.random() < .5
                ? "cross"
                : "jab";


    venom.classList.add(
        attackType
    );


    setTimeout(
        () => {

            venom.classList.remove(
                attackType
            );

        },
        attackType === "heavy"
            ? 380
            : 270
    );


    /* Jump avoids attacks */

    if(jumping){

        showMessage(
            "DODGED!"
        );

        playSound(
            420,
            .07,
            "sine"
        );

        return;

    }


    let damage =
        attackType === "heavy"
            ? 16
            : attackType === "cross"
                ? 10
                : 7;


    /* Blocking reduces damage */

    if(blocking){

        damage =
            Math.floor(
                damage * .2
            );

        showMessage(
            "BLOCKED!"
        );

        playSound(
            90,
            .08,
            "square"
        );

    }
    else{

        showMessage(
            "VENOM HIT!"
        );

        bobby.classList.add(
            "hit"
        );

        createImpact(
            bobby,
            attackType === "heavy"
        );

        screenShake();

        playSound(
            75,
            .13,
            "sawtooth"
        );


        setTimeout(
            () => {

                bobby.classList.remove(
                    "hit"
                );

            },
            260
        );

    }


    playerHP -= damage;

    playerHP =
        Math.max(
            0,
            playerHP
        );


    updateHUD();


    if(playerHP <= 0){

        knockout(
            "VENOM"
        );

    }

}


/* =========================================================
   STAMINA REGEN
========================================================= */

setInterval(
    () => {

        if(!running)
            return;


        playerSP =
            Math.min(
                100,
                playerSP + 2.2
            );


        enemySP =
            Math.min(
                100,
                enemySP + 2.6
            );


        updateHUD();

    },
    400
);


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(
        gameTimer
    );


    gameTimer =
        setInterval(
            () => {

                if(!running)
                    return;


                timeLeft--;

                timer.innerText =
                    timeLeft;


                if(
                    timeLeft <= 10
                ){

                    timer.classList.add(
                        "danger"
                    );

                }


                if(
                    timeLeft <= 0
                ){

                    clearInterval(
                        gameTimer
                    );

                    pointsDecision();

                }

            },
            1000
        );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    playerHealth.style.width =
        playerHP + "%";

    enemyHealth.style.width =
        enemyHP + "%";

    playerStamina.style.width =
        playerSP + "%";

    enemyStamina.style.width =
        enemySP + "%";

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    message.innerText =
        text;

    message.classList.remove(
        "messageShow"
    );

    void message.offsetWidth;

    message.classList.add(
        "messageShow"
    );

}


/* =========================================================
   SHAKE
========================================================= */

function screenShake(){

    game.classList.remove(
        "shake"
    );

    void game.offsetWidth;

    game.classList.add(
        "shake"
    );

}


/* =========================================================
   KNOCKOUT
========================================================= */

function knockout(winner){

    running = false;

    clearInterval(
        aiTimer
    );

    clearInterval(
        gameTimer
    );


    showMessage(
        "K.O.!"
    );


    if(winner === "BOBBY"){

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultSub.innerText =
            "🥊 KNOCKOUT! 🥊";

    }
    else{

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultSub.innerText =
            "VENOM KNOCKED BOBBY OUT";

    }


    setTimeout(
        () => {

            gameOver.style.display =
                "flex";

        },
        900
    );

}


/* =========================================================
   TIME RESULT
========================================================= */

function pointsDecision(){

    running = false;

    clearInterval(
        aiTimer
    );


    if(
        playerHP >
        enemyHP
    ){

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultSub.innerText =
            "🏆 WIN BY POINTS";

    }
    else if(
        enemyHP >
        playerHP
    ){

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultSub.innerText =
            "VENOM WINS BY POINTS";

    }
    else{

        result.innerHTML =
            '<span>DRAW!</span>';

        resultSub.innerText =
            "🔥 WHAT A FIGHT!";

    }


    gameOver.style.display =
        "flex";

}


/* =========================================================
   SOUND ENGINE
========================================================= */

function playSound(
    frequency,
    duration,
    type
){

    if(!audioContext)
        return;


    try{

        const oscillator =
            audioContext
            .createOscillator();

        const gain =
            audioContext
            .createGain();


        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );


        gain.gain
            .exponentialRampToValueAtTime(
                .14,
                audioContext.currentTime
                + .01
            );


        gain.gain
            .exponentialRampToValueAtTime(
                .0001,
                audioContext.currentTime
                + duration
            );


        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime
            + duration
        );

    }
    catch(error){

        /* Game continues if audio
           isn't supported. */

    }

}


/* =========================================================
   INITIAL POSITION
========================================================= */

bobby.style.left =
    playerX + "%";

venom.style.left =
    enemyX + "%";

updateHUD();

</script>

</body>
</html>
