<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobby Boxing V2 🥊</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #08080d;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 15%, #41416b 0%, #17172b 35%, #08080d 75%);
}

/* =========================
   ARENA
========================= */

.arena-light {
    position: absolute;
    top: -10%;
    width: 25%;
    height: 70%;
    opacity: .25;
    filter: blur(5px);
    background: linear-gradient(
        rgba(255,255,255,.8),
        transparent
    );
}

.arena-light.left {
    left: 5%;
    transform: rotate(12deg);
}

.arena-light.right {
    right: 5%;
    transform: rotate(-12deg);
}

#title {
    position: absolute;
    top: 2%;
    width: 100%;
    text-align: center;
    z-index: 20;
    color: white;
    font-size: clamp(25px, 4vw, 48px);
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow:
        0 3px 0 #000,
        0 0 15px rgba(255,70,70,.7);
}

/* Crowd */

#crowd {
    position: absolute;
    top: 12%;
    width: 100%;
    text-align: center;
    font-size: clamp(22px, 4vw, 45px);
    letter-spacing: 7px;
    opacity: .8;
    white-space: nowrap;
}

/* =========================
   HUD
========================= */

.hud {
    position: absolute;
    top: 11%;
    width: 34%;
    z-index: 30;
}

#playerHud {
    left: 4%;
}

#enemyHud {
    right: 4%;
    text-align: right;
}

.player-name {
    color: white;
    font-size: clamp(15px, 2vw, 25px);
    font-weight: 900;
    margin-bottom: 5px;
    text-shadow: 2px 2px #000;
}

.bar {
    position: relative;
    height: 25px;
    background: #202020;
    border: 3px solid white;
    border-radius: 7px;
    overflow: hidden;
    box-shadow: 0 3px 10px #000;
}

.health {
    width: 100%;
    height: 100%;
    background: #21d45a;
    transition: width .2s;
}

.stamina {
    width: 100%;
    height: 100%;
    background: #22a8ff;
    transition: width .15s;
}

.bar-label {
    position: absolute;
    left: 7px;
    top: 2px;
    color: white;
    font-size: 13px;
    font-weight: bold;
    z-index: 2;
    text-shadow: 1px 1px #000;
}

#enemyHud .bar-label {
    left: auto;
    right: 7px;
}

/* Round */

#roundBox {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    text-align: center;
    color: white;
}

#round {
    font-size: 17px;
    font-weight: bold;
}

#timer {
    font-size: 38px;
    font-weight: 900;
    line-height: 40px;
    text-shadow: 2px 2px #000;
}

/* Combo */

#combo {
    position: absolute;
    top: 28%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    color: #ffd43b;
    font-size: clamp(22px, 3vw, 38px);
    font-weight: 900;
    text-shadow:
        3px 3px #000,
        0 0 12px #ff8c00;
    opacity: 0;
    transition: .15s;
}

#combo.show {
    opacity: 1;
}

/* Message */

#message {
    position: absolute;
    top: 32%;
    width: 100%;
    text-align: center;
    z-index: 50;
    color: white;
    font-size: clamp(25px, 4vw, 50px);
    font-weight: 900;
    text-shadow: 4px 4px #000;
}

/* =========================
   RING
========================= */

#ring {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: 8%;
    height: 52%;
    background: #dcdcdc;
    border: 12px solid #171717;
    box-shadow:
        0 15px 35px #000,
        inset 0 0 30px rgba(0,0,0,.3);
}

/* Canvas-like ring floor */

#floor {
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            45deg,
            #eeeeee 0,
            #eeeeee 25px,
            #d6d6d6 25px,
            #d6d6d6 50px
        );
}

/* Ropes */

.rope {
    position: absolute;
    left: -12px;
    right: -12px;
    height: 8px;
    background: #e63946;
    border-top: 2px solid rgba(255,255,255,.5);
    border-bottom: 2px solid rgba(0,0,0,.3);
    z-index: 10;
}

.rope1 { top: 20%; }
.rope2 { top: 42%; }
.rope3 { top: 64%; }

/* Posts */

.post {
    position: absolute;
    top: -15px;
    bottom: -15px;
    width: 22px;
    background: #111;
    z-index: 12;
}

.post.left {
    left: 4%;
}

.post.right {
    right: 4%;
}

/* =========================
   FIGHTERS
========================= */

.fighter {
    position: absolute;
    bottom: 13%;
    width: 105px;
    height: 190px;
    z-index: 15;
}

#bobby {
    left: 20%;
}

#enemy {
    left: 72%;
}

/* Head */

.head {
    position: absolute;
    top: 0;
    left: 31px;
    width: 44px;
    height: 44px;
    background: #c98258;
    border: 4px solid #151515;
    border-radius: 50%;
    z-index: 5;
}

/* Hair */

.head::before {
    content: "";
    position: absolute;
    top: -5px;
    left: 1px;
    width: 35px;
    height: 17px;
    background: #151515;
    border-radius: 50% 50% 20% 20%;
}

/* Eye */

.head::after {
    content: "";
    position: absolute;
    right: 5px;
    top: 19px;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
}

/* Body */

.body {
    position: absolute;
    top: 41px;
    left: 25px;
    width: 55px;
    height: 75px;
    border: 4px solid #111;
    border-radius: 16px 16px 10px 10px;
    z-index: 3;
}

/* Bobby shirt */

#bobby .body {
    background: linear-gradient(#2563eb, #102a8a);
}

/* Venom shirt */

#enemy .body {
    background: linear-gradient(#222, #050505);
}

/* Arms */

.arm {
    position: absolute;
    top: 47px;
    width: 28px;
    height: 65px;
    background: #c98258;
    border: 4px solid #111;
    border-radius: 20px;
    z-index: 2;
    transform-origin: top center;
}

.left-arm {
    left: 2px;
    transform: rotate(25deg);
}

.right-arm {
    right: 2px;
    transform: rotate(-25deg);
}

/* Gloves */

.glove {
    position: absolute;
    width: 35px;
    height: 35px;
    border: 4px solid #111;
    border-radius: 50%;
    z-index: 6;
}

#bobby .glove {
    background: #e11d48;
}

#enemy .glove {
    background: #050505;
    box-shadow: 0 0 8px #555;
}

.left-glove {
    left: -7px;
    top: 95px;
}

.right-glove {
    right: -7px;
    top: 95px;
}

/* Legs */

.leg {
    position: absolute;
    top: 108px;
    width: 27px;
    height: 73px;
    background: #111827;
    border: 4px solid #111;
    z-index: 1;
}

.left-leg {
    left: 25px;
    transform: rotate(4deg);
}

.right-leg {
    right: 25px;
    transform: rotate(-4deg);
}

/* Shoes */

.shoe {
    position: absolute;
    width: 35px;
    height: 18px;
    background: #111;
    border-radius: 50%;
    bottom: -7px;
}

.left-shoe {
    left: 18px;
}

.right-shoe {
    right: 18px;
}

/* =========================
   ANIMATIONS
========================= */

.punch-jab .right-arm {
    transform: rotate(-75deg) translateX(30px);
}

.punch-cross .right-arm {
    transform: rotate(-100deg) translateX(45px);
}

.punch-heavy .right-arm {
    transform: rotate(-125deg) translateX(55px);
}

.punch-jab .right-glove,
.punch-cross .right-glove,
.punch-heavy .right-glove {
    transform: translate(35px, -20px);
}

.blocking .left-arm {
    transform: rotate(-55deg) translateY(-20px);
}

.blocking .right-arm {
    transform: rotate(55deg) translateY(-20px);
}

.blocking .left-glove {
    transform: translate(12px, -25px);
}

.blocking .right-glove {
    transform: translate(-12px, -25px);
}

.jump {
    bottom: 35% !important;
}

.hit {
    animation: hit .2s;
}

@keyframes hit {
    0% { transform: translateX(0); }
    35% { transform: translateX(20px) rotate(3deg); }
    70% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
}

/* Hit flash */

#hitFlash {
    position: absolute;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    background: white;
}

#hitFlash.active {
    animation: flash .12s;
}

@keyframes flash {
    0% { opacity: .45; }
    100% { opacity: 0; }
}

/* =========================
   CONTROLS
========================= */

#controls {
    position: absolute;
    bottom: 1%;
    width: 100%;
    text-align: center;
    color: #ddd;
    z-index: 30;
    font-size: clamp(11px, 1.5vw, 17px);
    font-weight: bold;
}

.key {
    display: inline-block;
    padding: 3px 7px;
    margin: 0 2px;
    background: #252525;
    border: 1px solid #666;
    border-radius: 4px;
    color: white;
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    position: absolute;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,.75);
    color: white;
    text-align: center;
}

#gameOver h1 {
    font-size: clamp(45px, 8vw, 90px);
    text-shadow: 0 5px 15px #000;
}

#gameOver p {
    margin-top: 15px;
    font-size: 22px;
}

#restart {
    margin-top: 25px;
    padding: 13px 30px;
    border: 0;
    border-radius: 8px;
    background: #e63946;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

#restart:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div id="game">

    <div class="arena-light left"></div>
    <div class="arena-light right"></div>

    <div id="title">🥊 BOBBY BOXING 🥊</div>

    <div id="crowd">
        👤 👤 👤 👤 👤 👤 👤 👤 👤 👤 👤
    </div>

    <!-- PLAYER HUD -->
    <div id="playerHud" class="hud">
        <div class="player-name">🥊 BOBBY</div>

        <div class="bar">
            <div id="playerHealth" class="health"></div>
            <div class="bar-label">HEALTH</div>
        </div>

        <div class="bar" style="margin-top:5px;">
            <div id="playerStamina" class="stamina"></div>
            <div class="bar-label">STAMINA</div>
        </div>
    </div>

    <!-- ENEMY HUD -->
    <div id="enemyHud" class="hud">
        <div class="player-name">VENOM 🖤</div>

        <div class="bar">
            <div id="enemyHealth" class="health"></div>
            <div class="bar-label">HEALTH</div>
        </div>

        <div class="bar" style="margin-top:5px;">
            <div id="enemyStamina" class="stamina"></div>
            <div class="bar-label">STAMINA</div>
        </div>
    </div>

    <!-- ROUND -->
    <div id="roundBox">
        <div id="round">ROUND 1</div>
        <div id="timer">60</div>
    </div>

    <div id="combo">COMBO x2 🔥</div>

    <div id="message">FIGHT! 🥊</div>

    <!-- RING -->
    <div id="ring">

        <div id="floor"></div>

        <div class="rope rope1"></div>
        <div class="rope rope2"></div>
        <div class="rope rope3"></div>

        <div class="post left"></div>
        <div class="post right"></div>

        <!-- BOBBY -->
        <div id="bobby" class="fighter">

            <div class="head"></div>
            <div class="body"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="glove left-glove"></div>
            <div class="glove right-glove"></div>

            <div class="leg left-leg">
                <div class="shoe left-shoe"></div>
            </div>

            <div class="leg right-leg">
                <div class="shoe right-shoe"></div>
            </div>

        </div>

        <!-- VENOM -->
        <div id="enemy" class="fighter">

            <div class="head"></div>
            <div class="body"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="glove left-glove"></div>
            <div class="glove right-glove"></div>

            <div class="leg left-leg">
                <div class="shoe left-shoe"></div>
            </div>

            <div class="leg right-leg">
                <div class="shoe right-shoe"></div>
            </div>

        </div>

    </div>

    <div id="controls">
        <span class="key">A</span>/<span class="key">D</span> Move
        &nbsp; | &nbsp;
        <span class="key">W</span> Jump
        &nbsp; | &nbsp;
        <span class="key">J</span> Jab
        &nbsp; | &nbsp;
        <span class="key">K</span> Cross
        &nbsp; | &nbsp;
        <span class="key">L</span> Heavy
        &nbsp; | &nbsp;
        <span class="key">S</span> Block
    </div>

    <div id="hitFlash"></div>

    <!-- GAME OVER -->
    <div id="gameOver">
        <h1 id="result">K.O!</h1>
        <p id="resultText">Bobby wins!</p>
        <button id="restart">🔄 REMATCH</button>
    </div>

</div>

<script>

/* ==========================================
   GAME VARIABLES
========================================== */

const bobby = document.getElementById("bobby");
const enemy = document.getElementById("enemy");

const playerHealthBar =
    document.getElementById("playerHealth");

const enemyHealthBar =
    document.getElementById("enemyHealth");

const playerStaminaBar =
    document.getElementById("playerStamina");

const enemyStaminaBar =
    document.getElementById("enemyStamina");

const message =
    document.getElementById("message");

const comboDisplay =
    document.getElementById("combo");

const timerDisplay =
    document.getElementById("timer");

const gameOverScreen =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");

const hitFlash =
    document.getElementById("hitFlash");

let playerHP = 100;
let enemyHP = 100;

let playerStamina = 100;
let enemyStamina = 100;

let playerX = 20;
let enemyX = 72;

let jumping = false;
let blocking = false;

let gameOver = false;

let timeLeft = 60;

let combo = 0;
let comboTimer = null;

let keys = {};

/* ==========================================
   ATTACK SETTINGS
========================================== */

const attacks = {

    jab: {
        damage: 7,
        stamina: 5,
        className: "punch-jab",
        message: "👊 JAB!"
    },

    cross: {
        damage: 11,
        stamina: 10,
        className: "punch-cross",
        message: "🥊 CROSS!"
    },

    heavy: {
        damage: 19,
        stamina: 20,
        className: "punch-heavy",
        message: "💥 HEAVY!"
    }

};


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    keys[key] = true;

    if (gameOver)
        return;

    /* Movement */

    if (key === "a") {

        playerX -= 2.5;

        if (playerX < 5)
            playerX = 5;

        updatePlayerPosition();
    }

    if (key === "d") {

        playerX += 2.5;

        if (playerX > 82)
            playerX = 82;

        updatePlayerPosition();
    }

    /* Jump */

    if (key === "w") {

        jump();
    }

    /* Block */

    if (key === "s") {

        startBlock();
    }

    /* Attacks */

    if (key === "j") {

        attack("jab");
    }

    if (key === "k") {

        attack("cross");
    }

    if (key === "l") {

        attack("heavy");
    }

});


document.addEventListener("keyup", function(event) {

    const key = event.key.toLowerCase();

    keys[key] = false;

    if (key === "s") {

        stopBlock();
    }

});


/* ==========================================
   POSITION
========================================== */

function updatePlayerPosition() {

    bobby.style.left = playerX + "%";

}


/* ==========================================
   JUMP
========================================== */

function jump() {

    if (jumping)
        return;

    jumping = true;

    bobby.classList.add("jump");

    setTimeout(function() {

        bobby.classList.remove("jump");

        jumping = false;

    }, 450);

}


/* ==========================================
   BLOCK
========================================== */

function startBlock() {

    if (blocking)
        return;

    blocking = true;

    bobby.classList.add("blocking");

    message.innerText = "🛡️ BLOCKING";

}


function stopBlock() {

    blocking = false;

    bobby.classList.remove("blocking");

    if (!gameOver)
        message.innerText = "FIGHT! 🥊";

}


/* ==========================================
   PLAYER ATTACK
========================================== */

function attack(type) {

    if (gameOver)
        return;

    if (blocking)
        return;

    const attackData = attacks[type];

    if (playerStamina < attackData.stamina) {

        message.innerText = "⚡ TOO TIRED!";

        return;
    }

    playerStamina -= attackData.stamina;

    updateBars();

    bobby.classList.remove(
        "punch-jab",
        "punch-cross",
        "punch-heavy"
    );

    void bobby.offsetWidth;

    bobby.classList.add(attackData.className);

    setTimeout(function() {

        bobby.classList.remove(attackData.className);

    }, 220);

    const distance =
        Math.abs(playerX - enemyX);

    if (distance < 25) {

        dealDamageToEnemy(attackData.damage);

        registerCombo();

    }
    else {

        message.innerText = "🥊 MISS!";

    }

}


/* ==========================================
   DAMAGE ENEMY
========================================== */

function dealDamageToEnemy(damage) {

    /* Enemy block */

    const enemyBlocking =
        enemy.classList.contains("blocking");

    if (enemyBlocking) {

        damage = Math.floor(damage * .25);

        message.innerText =
            "🛡️ VENOM BLOCKED!";

    }
    else {

        message.innerText =
            damage >= 15
                ? "💥 MASSIVE HIT!"
                : "👊 HIT!";
    }

    enemyHP -= damage;

    if (enemyHP < 0)
        enemyHP = 0;

    enemyHealthBar.style.width =
        enemyHP + "%";

    enemy.classList.add("hit");

    hitFlash.classList.remove("active");

    void hitFlash.offsetWidth;

    hitFlash.classList.add("active");

    setTimeout(function() {

        enemy.classList.remove("hit");

    }, 200);

    if (enemyHP <= 0) {

        winGame();

    }

}


/* ==========================================
   COMBO
========================================== */

function registerCombo() {

    combo++;

    comboDisplay.innerText =
        "COMBO x" + combo + " 🔥";

    comboDisplay.classList.add("show");

    clearTimeout(comboTimer);

    comboTimer = setTimeout(function() {

        combo = 0;

        comboDisplay.classList.remove("show");

    }, 1200);

}


/* ==========================================
   ENEMY AI
========================================== */

setInterval(function() {

    if (gameOver)
        return;

    const distance =
        Math.abs(playerX - enemyX);

    /* Move toward Bobby */

    if (distance > 18) {

        if (enemyX > playerX) {

            enemyX -= 1;

        }
        else {

            enemyX += 1;

        }

        enemy.style.left = enemyX + "%";
    }

    /* Enemy attack */

    if (distance < 20 &&
        enemyStamina >= 10 &&
        Math.random() < .35) {

        enemyAttack();

    }

    /* Random block */

    if (distance < 25 &&
        Math.random() < .12) {

        enemy.classList.add("blocking");

        setTimeout(function() {

            enemy.classList.remove("blocking");

        }, 500);

    }

}, 400);


/* ==========================================
   ENEMY ATTACK
========================================== */

function enemyAttack() {

    enemyStamina -= 10;

    if (enemyStamina < 0)
        enemyStamina = 0;

    updateBars();

    const damage =
        Math.random() < .25
            ? 15
            : 8;

    /* Bobby blocking */

    if (blocking) {

        const blockedDamage =
            Math.floor(damage * .2);

        playerHP -= blockedDamage;

        message.innerText =
            "🛡️ PERFECT BLOCK!";

    }
    else if (jumping) {

        message.innerText =
            "🌀 DODGED!";

        return;

    }
    else {

        playerHP -= damage;

        message.innerText =
            damage > 10
                ? "💥 VENOM HEAVY HIT!"
                : "👊 VENOM HIT!";

        bobby.classList.add("hit");

        setTimeout(function() {

            bobby.classList.remove("hit");

        }, 200);

    }

    if (playerHP < 0)
        playerHP = 0;

    updateBars();

    if (playerHP <= 0) {

        loseGame();

    }

}


/* ==========================================
   STAMINA REGENERATION
========================================== */

setInterval(function() {

    if (gameOver)
        return;

    if (!blocking) {

        playerStamina += 3;

    }

    enemyStamina += 4;

    if (playerStamina > 100)
        playerStamina = 100;

    if (enemyStamina > 100)
        enemyStamina = 100;

    updateBars();

}, 500);


/* ==========================================
   UPDATE BARS
========================================== */

function updateBars() {

    playerHealthBar.style.width =
        playerHP + "%";

    enemyHealthBar.style.width =
        enemyHP + "%";

    playerStaminaBar.style.width =
        playerStamina + "%";

    enemyStaminaBar.style.width =
        enemyStamina + "%";

}


/* ==========================================
   ROUND TIMER
========================================== */

const roundTimer =
    setInterval(function() {

        if (gameOver)
            return;

        timeLeft--;

        timerDisplay.innerText =
            timeLeft;

        if (timeLeft <= 10) {

            timerDisplay.style.color =
                "#ff3333";

        }

        if (timeLeft <= 0) {

            endRound();

        }

    }, 1000);


/* ==========================================
   ROUND END
========================================== */

function endRound() {

    gameOver = true;

    if (playerHP > enemyHP) {

        result.innerText = "🏆 ROUND WIN!";

        resultText.innerText =
            "Bobby wins on points!";

    }
    else if (enemyHP > playerHP) {

        result.innerText = "💀 ROUND LOST";

        resultText.innerText =
            "Venom wins on points!";

    }
    else {

        result.innerText = "🤝 DRAW!";

        resultText.innerText =
            "Nobody wins this round!";

    }

    gameOverScreen.style.display =
        "flex";

}


/* ==========================================
   WIN
========================================== */

function winGame() {

    gameOver = true;

    result.innerText =
        "🏆 KNOCKOUT!";

    resultText.innerText =
        "BOBBY DEFEATED VENOM! 🔥🥊";

    gameOverScreen.style.display =
        "flex";

}


/* ==========================================
   LOSE
========================================== */

function loseGame() {

    gameOver = true;

    result.innerText =
        "💀 K.O.!";

    resultText.innerText =
        "VENOM KNOCKED BOBBY OUT!";

    gameOverScreen.style.display =
        "flex";

}


/* ==========================================
   RESTART
========================================== */

document.getElementById("restart")
    .addEventListener("click", function() {

        location.reload();

    });


/* ==========================================
   START
========================================== */

updateBars();

</script>
