<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobby Boxing - V3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #07070b;
    font-family: Arial, sans-serif;
}

/* =========================
   GAME
========================= */

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 15%,
            #34345c 0%,
            #15152a 35%,
            #07070b 80%
        );
}

/* =========================
   ARENA
========================= */

#lights {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.light {
    position: absolute;
    width: 220px;
    height: 500px;
    background: linear-gradient(
        rgba(255,255,255,.16),
        transparent
    );
    filter: blur(12px);
}

.light:nth-child(1) {
    left: 5%;
    transform: rotate(12deg);
}

.light:nth-child(2) {
    left: 40%;
}

.light:nth-child(3) {
    right: 5%;
    transform: rotate(-12deg);
}

/* Crowd */

#crowd {
    position: absolute;
    top: 13%;
    width: 100%;
    text-align: center;
    font-size: 42px;
    letter-spacing: 8px;
    opacity: .7;
}

/* =========================
   TITLE
========================= */

#title {
    position: absolute;
    top: 2%;
    width: 100%;
    text-align: center;

    color: white;
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 900;
    letter-spacing: 4px;

    text-shadow:
        3px 4px 0 #000,
        0 0 20px #ff3030;
}

/* =========================
   HUD
========================= */

.hud {
    position: absolute;
    top: 10%;
    width: 30%;
    z-index: 20;
}

#playerHUD {
    left: 4%;
}

#enemyHUD {
    right: 4%;
    text-align: right;
}

.name {
    color: white;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 5px;
}

.bar {
    height: 25px;
    background: #181818;
    border: 3px solid white;
    border-radius: 5px;
    overflow: hidden;
}

.health {
    height: 100%;
    width: 100%;
    background: #20d45a;
    transition: width .2s;
}

.stamina {
    height: 100%;
    width: 100%;
    background: #19a9ff;
    transition: width .2s;
}

.small {
    margin-top: 5px;
}

/* Center HUD */

#roundHUD {
    position: absolute;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
    z-index: 30;
}

#round {
    font-size: 17px;
    font-weight: bold;
}

#timer {
    font-size: 42px;
    font-weight: 900;
}

/* =========================
   RING
========================= */

#ring {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: 9%;
    height: 54%;

    border: 12px solid #171717;

    background:
        repeating-linear-gradient(
            45deg,
            #eeeeee 0,
            #eeeeee 25px,
            #d4d4d4 25px,
            #d4d4d4 50px
        );

    box-shadow:
        0 20px 40px black,
        inset 0 0 40px rgba(0,0,0,.3);
}

/* ropes */

.rope {
    position: absolute;
    left: -12px;
    right: -12px;
    height: 8px;
    background: #e32635;
    z-index: 10;
}

.rope.one {
    top: 20%;
}

.rope.two {
    top: 42%;
}

.rope.three {
    top: 64%;
}

/* posts */

.post {
    position: absolute;
    top: -15px;
    bottom: -15px;
    width: 22px;
    background: #111;
    z-index: 15;
}

.post.left {
    left: 4%;
}

.post.right {
    right: 4%;
}

/* =========================
   FIGHTERS
========================= */

.fighter {
    position: absolute;
    width: 110px;
    height: 205px;
    bottom: 13%;

    transition:
        left .08s linear,
        bottom .15s ease;
}

/* Bobby */

#bobby {
    left: 20%;
}

/* Venom */

#venom {
    left: 72%;
}

/* =========================
   CHARACTER
========================= */

.head {
    position: absolute;

    width: 45px;
    height: 45px;

    left: 33px;
    top: 0;

    border-radius: 50%;

    background: #c9875f;

    border: 4px solid #111;

    z-index: 5;
}

/* hair */

.head::before {
    content: "";

    position: absolute;

    width: 37px;
    height: 17px;

    top: -5px;
    left: 1px;

    border-radius: 50% 50% 20% 20%;

    background: #151515;
}

/* eyes */

.head::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    top: 20px;
    right: 5px;

    background: white;
    border-radius: 50%;
}

/* body */

.body {
    position: absolute;

    width: 58px;
    height: 78px;

    left: 26px;
    top: 42px;

    border-radius: 15px;

    border: 4px solid #111;

    z-index: 3;
}

#bobby .body {
    background:
        linear-gradient(
            #2563eb,
            #102a8a
        );
}

#venom .body {
    background:
        linear-gradient(
            #202020,
            #030303
        );
}

/* arms */

.arm {
    position: absolute;

    width: 29px;
    height: 67px;

    top: 47px;

    background: #c9875f;

    border: 4px solid #111;

    border-radius: 20px;

    transform-origin: top center;

    z-index: 2;
}

.left-arm {
    left: 2px;
    transform: rotate(25deg);
}

.right-arm {
    right: 2px;
    transform: rotate(-25deg);
}

/* gloves */

.glove {
    position: absolute;

    width: 36px;
    height: 36px;

    border-radius: 50%;

    border: 4px solid #111;

    z-index: 8;
}

#bobby .glove {
    background: #e21d48;
}

#venom .glove {
    background: #050505;
    box-shadow: 0 0 12px #555;
}

.left-glove {
    left: -8px;
    top: 95px;
}

.right-glove {
    right: -8px;
    top: 95px;
}

/* legs */

.leg {
    position: absolute;

    width: 28px;
    height: 75px;

    top: 110px;

    background: #111827;

    border: 4px solid #111;
}

.left-leg {
    left: 26px;
}

.right-leg {
    right: 26px;
}

/* =========================
   ATTACK ANIMATIONS
========================= */

.jab .right-arm {
    transform:
        rotate(-75deg)
        translateX(30px);
}

.jab .right-glove {
    transform:
        translate(30px,-20px);
}

.cross .right-arm {
    transform:
        rotate(-105deg)
        translateX(45px);
}

.cross .right-glove {
    transform:
        translate(42px,-30px);
}

.heavy .right-arm {
    transform:
        rotate(-125deg)
        translateX(55px);
}

.heavy .right-glove {
    transform:
        translate(55px,-35px);
}

/* Block */

.block .left-arm {
    transform:
        rotate(-55deg)
        translateY(-25px);
}

.block .right-arm {
    transform:
        rotate(55deg)
        translateY(-25px);
}

.block .left-glove {
    transform: translate(12px,-25px);
}

.block .right-glove {
    transform: translate(-12px,-25px);
}

/* Hit */

.hit {
    animation: hit .2s;
}

@keyframes hit {

    0% {
        transform: translateX(0);
    }

    40% {
        transform:
            translateX(25px)
            rotate(4deg);
    }

    70% {
        transform: translateX(-10px);
    }

    100% {
        transform: translateX(0);
    }

}

/* Jump */

.jump {
    bottom: 35% !important;
}

/* =========================
   COMBO
========================= */

#combo {
    position: absolute;

    top: 28%;
    left: 50%;

    transform: translateX(-50%);

    color: #ffd43b;

    font-size: 35px;
    font-weight: 900;

    text-shadow:
        3px 3px black,
        0 0 15px #ff7b00;

    opacity: 0;

    z-index: 50;
}

#combo.show {
    opacity: 1;
}

/* =========================
   MESSAGE
========================= */

#message {
    position: absolute;

    top: 34%;

    width: 100%;

    text-align: center;

    color: white;

    font-size: clamp(25px,4vw,50px);

    font-weight: 900;

    text-shadow:
        4px 4px #000;

    z-index: 50;
}

/* =========================
   CONTROLS
========================= */

#controls {
    position: absolute;

    bottom: 1%;

    width: 100%;

    text-align: center;

    color: white;

    font-size: 15px;

    z-index: 50;
}

.key {
    padding: 4px 8px;

    background: #242424;

    border:
        1px solid #777;

    border-radius: 5px;
}

/* =========================
   IMPACT
========================= */

#impact {
    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 100;

    opacity: 0;
}

#impact.show {

    animation:
        impact .25s;

}

@keyframes impact {

    0% {
        opacity: 1;
        transform:
            scale(.2)
            rotate(0);
    }

    100% {
        opacity: 0;
        transform:
            scale(1.5)
            rotate(90deg);
    }

}

/* =========================
   GAME OVER
========================= */

#gameOver {

    position: absolute;

    inset: 0;

    background:
        rgba(0,0,0,.82);

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color: white;

    z-index: 200;

    text-align: center;
}

#gameOver h1 {

    font-size:
        clamp(45px,8vw,90px);

    text-shadow:
        0 5px 15px black;

}

#gameOver p {

    font-size: 22px;

    margin-top: 10px;

}

#restart {

    margin-top: 25px;

    padding:
        14px 32px;

    border: none;

    border-radius: 8px;

    background: #e32635;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

}

#restart:hover {

    transform: scale(1.08);

}
</style>
</head>

<body>

<div id="game">

    <div id="lights">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
    </div>

    <div id="title">
        🥊 BOBBY BOXING 🥊
    </div>

    <div id="crowd">
        👤 👤 👤 👤 👤 👤 👤 👤 👤 👤
    </div>

    <!-- PLAYER HUD -->

    <div id="playerHUD" class="hud">

        <div class="name">
            🥊 BOBBY
        </div>

        <div class="bar">
            <div
                id="playerHealth"
                class="health">
            </div>
        </div>

        <div class="bar small">
            <div
                id="playerStamina"
                class="stamina">
            </div>
        </div>

    </div>

    <!-- ENEMY HUD -->

    <div id="enemyHUD" class="hud">

        <div class="name">
            VENOM 🖤
        </div>

        <div class="bar">
            <div
                id="enemyHealth"
                class="health">
            </div>
        </div>

        <div class="bar small">
            <div
                id="enemyStamina"
                class="stamina">
            </div>
        </div>

    </div>

    <!-- ROUND -->

    <div id="roundHUD">

        <div id="round">
            ROUND 1
        </div>

        <div id="timer">
            60
        </div>

    </div>

    <!-- COMBO -->

    <div id="combo">
        COMBO x2 🔥
    </div>

    <!-- MESSAGE -->

    <div id="message">
        FIGHT! 🥊
    </div>

    <!-- RING -->

    <div id="ring">

        <div class="rope one"></div>
        <div class="rope two"></div>
        <div class="rope three"></div>

        <div class="post left"></div>
        <div class="post right"></div>

        <!-- BOBBY -->

        <div id="bobby" class="fighter">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="glove left-glove"></div>
            <div class="glove right-glove"></div>

            <div class="leg left-leg"></div>
            <div class="leg right-leg"></div>

        </div>

        <!-- VENOM -->

        <div id="venom" class="fighter">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="glove left-glove"></div>
            <div class="glove right-glove"></div>

            <div class="leg left-leg"></div>
            <div class="leg right-leg"></div>

        </div>

    </div>

    <!-- CONTROLS -->

    <div id="controls">

        <span class="key">A</span>
        <span class="key">D</span>
        Move

        &nbsp; | &nbsp;

        <span class="key">W</span>
        Jump

        &nbsp; | &nbsp;

        <span class="key">J</span>
        Jab

        &nbsp; | &nbsp;

        <span class="key">K</span>
        Cross

        &nbsp; | &nbsp;

        <span class="key">L</span>
        Heavy

        &nbsp; | &nbsp;

        <span class="key">S</span>
        Block

    </div>

    <div id="impact"></div>

    <!-- GAME OVER -->

    <div id="gameOver">

        <h1 id="result">
            K.O!
        </h1>

        <p id="resultText">
            Bobby wins!
        </p>

        <button id="restart">
            🔄 REMATCH
        </button>

    </div>

</div>


<script>

/* ==========================================
   ELEMENTS
========================================== */

const bobby =
    document.getElementById("bobby");

const venom =
    document.getElementById("venom");

const playerHealth =
    document.getElementById("playerHealth");

const enemyHealth =
    document.getElementById("enemyHealth");

const playerStamina =
    document.getElementById("playerStamina");

const enemyStamina =
    document.getElementById("enemyStamina");

const message =
    document.getElementById("message");

const comboDisplay =
    document.getElementById("combo");

const timerDisplay =
    document.getElementById("timer");

const gameOver =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");

const impact =
    document.getElementById("impact");


/* ==========================================
   GAME STATE
========================================== */

let playerHP = 100;
let venomHP = 100;

let playerStaminaValue = 100;
let venomStaminaValue = 100;

let playerX = 20;
let venomX = 72;

let jumping = false;
let blocking = false;

let gameEnded = false;

let time = 60;

let combo = 0;
let comboTimeout;


/* ==========================================
   ATTACKS
========================================== */

const attacks = {

    jab: {
        damage: 7,
        stamina: 5,
        animation: "jab",
        text: "👊 JAB!"
    },

    cross: {
        damage: 12,
        stamina: 10,
        animation: "cross",
        text: "🥊 CROSS!"
    },

    heavy: {
        damage: 20,
        stamina: 20,
        animation: "heavy",
        text: "💥 HEAVY!"
    }

};


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (gameEnded)
            return;

        const key =
            event.key.toLowerCase();

        /* Move */

        if (key === "a") {

            playerX -= 3;

            if (playerX < 5)
                playerX = 5;

            updatePosition();

        }

        if (key === "d") {

            playerX += 3;

            if (playerX > 84)
                playerX = 84;

            updatePosition();

        }

        /* Jump */

        if (key === "w") {

            jump();

        }

        /* Block */

        if (key === "s") {

            block();

        }

        /* Attacks */

        if (key === "j") {

            attack("jab");

        }

        if (key === "k") {

            attack("cross");

        }

        if (key === "l") {

            attack("heavy");

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key.toLowerCase()
            === "s"
        ) {

            stopBlock();

        }

    }
);


/* ==========================================
   POSITION
========================================== */

function updatePosition() {

    bobby.style.left =
        playerX + "%";

}


/* ==========================================
   JUMP
========================================== */

function jump() {

    if (jumping)
        return;

    jumping = true;

    bobby.classList.add("jump");

    setTimeout(
        function() {

            bobby.classList.remove(
                "jump"
            );

            jumping = false;

        },
        450
    );

}


/* ==========================================
   BLOCK
========================================== */

function block() {

    blocking = true;

    bobby.classList.add("block");

    message.innerText =
        "🛡️ BLOCK!";

}


function stopBlock() {

    blocking = false;

    bobby.classList.remove(
        "block"
    );

    if (!gameEnded) {

        message.innerText =
            "FIGHT! 🥊";

    }

}


/* ==========================================
   PLAYER ATTACK
========================================== */

function attack(type) {

    const data =
        attacks[type];

    if (
        playerStaminaValue
        < data.stamina
    ) {

        message.innerText =
            "⚡ TOO TIRED!";

        return;

    }

    playerStaminaValue -=
        data.stamina;

    updateBars();

    bobby.classList.remove(
        "jab",
        "cross",
        "heavy"
    );

    void bobby.offsetWidth;

    bobby.classList.add(
        data.animation
    );

    setTimeout(
        function() {

            bobby.classList.remove(
                data.animation
            );

        },
        220
    );

    const distance =
        Math.abs(
            playerX - venomX
        );

    if (distance <= 24) {

        hitVenom(
            data.damage
        );

        increaseCombo();

    }
    else {

        message.innerText =
            "🥊 MISS!";

    }

}


/* ==========================================
   HIT VENOM
========================================== */

function hitVenom(damage) {

    const venomBlocking =
        venom.classList.contains(
            "block"
        );

    if (venomBlocking) {

        damage =
            Math.floor(
                damage * .2
            );

        message.innerText =
            "🛡️ VENOM BLOCKED!";

    }
    else {

        message.innerText =
            damage >= 18
                ? "💥 DEVASTATING HIT!"
                : "👊 CLEAN HIT!";

    }

    venomHP -= damage;

    if (venomHP < 0)
        venomHP = 0;

    enemyHealth.style.width =
        venomHP + "%";

    venom.classList.add(
        "hit"
    );

    showImpact();

    setTimeout(
        function() {

            venom.classList.remove(
                "hit"
            );

        },
        200
    );

    if (venomHP <= 0) {

        win();

    }

}


/* ==========================================
   COMBO
========================================== */

function increaseCombo() {

    combo++;

    comboDisplay.innerText =
        "COMBO x" +
        combo +
        " 🔥";

    comboDisplay.classList.add(
        "show"
    );

    clearTimeout(
        comboTimeout
    );

    comboTimeout =
        setTimeout(
            function() {

                combo = 0;

                comboDisplay.classList.remove(
                    "show"
                );

            },
            1200
        );

}


/* ==========================================
   IMPACT EFFECT
========================================== */

function showImpact() {

    impact.classList.remove(
        "show"
    );

    void impact.offsetWidth;

    impact.innerText =
        "💥";

    impact.style.left =
        "50%";

    impact.style.top =
        "45%";

    impact.classList.add(
        "show"
    );

}


/* ==========================================
   VENOM AI
========================================== */

setInterval(
    function() {

        if (gameEnded)
            return;

        const distance =
            Math.abs(
                playerX - venomX
            );

        /* Approach */

        if (distance > 18) {

            if (
                venomX >
                playerX
            ) {

                venomX -= 1.2;

            }
            else {

                venomX += 1.2;

            }

            venom.style.left =
                venomX + "%";

        }

        /* Attack */

        if (
            distance < 21 &&
            Math.random() < .4
        ) {

            venomAttack();

        }

        /* Block */

        if (
            distance < 25 &&
            Math.random() < .15
        ) {

            venom.classList.add(
                "block"
            );

            setTimeout(
                function() {

                    venom.classList.remove(
                        "block"
                    );

                },
                500
            );

        }

    },
    450
);


/* ==========================================
   VENOM ATTACK
========================================== */

function venomAttack() {

    if (
        venomStaminaValue < 10
    )
        return;

    venomStaminaValue -= 10;

    updateBars();

    /* Bobby jumps */

    if (jumping) {

        message.innerText =
            "🌀 DODGED!";

        return;

    }

    let damage =
        Math.random() < .25
            ? 15
            : 8;

    if (blocking) {

        damage =
            Math.floor(
                damage * .2
            );

        message.innerText =
            "🛡️ PERFECT BLOCK!";

    }
    else {

        message.innerText =
            "💥 VENOM HIT!";

        bobby.classList.add(
            "hit"
        );

        setTimeout(
            function() {

                bobby.classList.remove(
                    "hit"
                );

            },
            200
        );

    }

    playerHP -= damage;

    if (playerHP < 0)
        playerHP = 0;

    updateBars();

    if (playerHP <= 0) {

        lose();

    }

}


/* ==========================================
   STAMINA
========================================== */

setInterval(
    function() {

        if (gameEnded)
            return;

        playerStaminaValue += 2;

        venomStaminaValue += 3;

        if (
            playerStaminaValue > 100
        )
            playerStaminaValue = 100;

        if (
            venomStaminaValue > 100
        )
            venomStaminaValue = 100;

        updateBars();

    },
    500
);


/* ==========================================
   UPDATE BARS
========================================== */

function updateBars() {

    playerHealth.style.width =
        playerHP + "%";

    enemyHealth.style.width =
        venomHP + "%";

    playerStamina.style.width =
        playerStaminaValue + "%";

    enemyStamina.style.width =
        venomStaminaValue + "%";

}


/* ==========================================
   TIMER
========================================== */

const gameTimer =
    setInterval(
        function() {

            if (gameEnded)
                return;

            time--;

            timerDisplay.innerText =
                time;

            if (time <= 10) {

                timerDisplay.style.color =
                    "#ff3030";

            }

            if (time <= 0) {

                timeUp();

            }

        },
        1000
    );


/* ==========================================
   TIME UP
========================================== */

function timeUp() {

    gameEnded = true;

    if (
        playerHP >
        venomHP
    ) {

        result.innerText =
            "🏆 WIN!";

        resultText.innerText =
            "Bobby wins on points!";

    }
    else if (
        venomHP >
        playerHP
    ) {

        result.innerText =
            "💀 LOSS!";

        resultText.innerText =
            "Venom wins on points!";

    }
    else {

        result.innerText =
            "🤝 DRAW!";

        resultText.innerText =
            "Both fighters are equal!";

    }

    gameOver.style.display =
        "flex";

}


/* ==========================================
   WIN
========================================== */

function win() {

    gameEnded = true;

    result.innerText =
        "🏆 K.O.!";

    resultText.innerText =
        "BOBBY DEFEATED VENOM! 🥊🔥";

    gameOver.style.display =
        "flex";

}


/* ==========================================
   LOSE
========================================== */

function lose() {

    gameEnded = true;

    result.innerText =
        "💀 K.O.!";

    resultText.innerText =
        "VENOM DEFEATED BOBBY!";

    gameOver.style.display =
        "flex";

}


/* ==========================================
   RESTART
========================================== */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/* ==========================================
   INITIALIZE
========================================== */

updateBars();

</script>
