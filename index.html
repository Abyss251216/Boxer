<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Bobby Boxing V5</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#05060c;
    color:white;
}

button{
    font-family:inherit;
}

/* =========================================
   GAME
========================================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:620px;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 25%,
            #30344e 0%,
            #171a2b 40%,
            #070810 80%
        );
}

/* =========================================
   LIGHTS
========================================= */

.light{
    position:absolute;
    top:-150px;
    width:260px;
    height:600px;

    background:rgba(255,255,255,.07);

    filter:blur(35px);

    transform:rotate(18deg);
}

.light.one{
    left:5%;
}

.light.two{
    left:43%;
    transform:rotate(0deg);
}

.light.three{
    right:5%;
    transform:rotate(-18deg);
}

/* =========================================
   TITLE
========================================= */

#title{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);

    z-index:100;

    font-size:clamp(28px,4.5vw,58px);

    font-weight:1000;
    letter-spacing:5px;

    white-space:nowrap;

    text-shadow:
        4px 4px 0 #000,
        0 0 20px #ef3150;
}

#title span{
    color:#ef3150;
}

/* =========================================
   HUD
========================================= */

.hud{
    position:absolute;
    top:28px;
    width:31%;
    z-index:120;
}

#playerHUD{
    left:2.5%;
}

#enemyHUD{
    right:2.5%;
}

.name{
    font-size:20px;
    font-weight:1000;
    margin-bottom:6px;
}

#enemyHUD .name{
    text-align:right;
}

.bar{
    width:100%;
    height:18px;

    margin-bottom:6px;

    background:#080808;

    border:2px solid #fff;

    border-radius:5px;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

.fill{
    width:100%;
    height:100%;

    transition:
        width .15s ease;
}

.health{
    background:
        linear-gradient(
            90deg,
            #0fc65a,
            #29ef67
        );
}

.stamina{
    background:
        linear-gradient(
            90deg,
            #087fd5,
            #2bb5ff
        );
}

/* =========================================
   ROUND
========================================= */

#roundBox{
    position:absolute;
    top:68px;
    left:50%;

    transform:translateX(-50%);

    z-index:130;

    text-align:center;

    text-shadow:
        3px 3px #000;
}

#roundText{
    font-size:12px;
    letter-spacing:3px;
    font-weight:bold;
}

#timer{
    font-size:36px;
    font-weight:1000;
}

#timer.danger{
    color:#ff263f;
    animation:timerPulse .5s infinite alternate;
}

@keyframes timerPulse{
    from{transform:scale(1);}
    to{transform:scale(1.12);}
}

/* =========================================
   COMBO
========================================= */

#combo{
    position:absolute;

    left:50%;
    top:21%;

    transform:translateX(-50%);

    z-index:200;

    text-align:center;

    opacity:0;
    pointer-events:none;
}

#comboNumber{
    font-size:52px;
    font-weight:1000;

    color:#ffd23f;

    text-shadow:
        4px 4px #000,
        0 0 20px #ff7b00;
}

#comboText{
    font-size:18px;
    font-weight:1000;
    letter-spacing:4px;
}

.comboShow{
    animation:comboPop .7s;
}

@keyframes comboPop{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.5);
    }

    25%{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.25);
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(1);
    }
}

/* =========================================
   CROWD
========================================= */

#crowd{
    position:absolute;
    top:145px;
    left:0;

    width:100%;

    text-align:center;

    color:#3b3f5c;

    font-size:34px;
    letter-spacing:10px;

    opacity:.7;
}

/* =========================================
   RING
========================================= */

#ring{
    position:absolute;

    left:4%;
    right:4%;
    bottom:8%;

    height:59%;

    border:12px solid #090909;

    overflow:hidden;

    background:
        repeating-linear-gradient(
            45deg,
            #f3f3f3 0px,
            #f3f3f3 36px,
            #d6d6d6 36px,
            #d6d6d6 72px
        );

    box-shadow:
        0 20px 50px rgba(0,0,0,.8);
}

/* =========================================
   ROPES
========================================= */

.rope{
    position:absolute;
    left:0;
    right:0;

    height:7px;

    background:#e52640;

    z-index:30;

    box-shadow:
        0 2px 4px rgba(0,0,0,.6);
}

.rope.one{top:20%;}
.rope.two{top:45%;}
.rope.three{top:70%;}

/* =========================================
   POSTS
========================================= */

.post{
    position:absolute;

    top:-10px;
    bottom:-10px;

    width:28px;

    background:#090909;

    z-index:40;
}

.post.left{left:5%;}
.post.right{right:5%;}

/* =========================================
   FLOOR
========================================= */

#floor{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:24%;

    background:
        linear-gradient(
            rgba(255,255,255,.15),
            rgba(0,0,0,.15)
        );

    border-top:2px solid rgba(0,0,0,.15);
}

/* =========================================
   FIGHTER
========================================= */

.fighter{
    position:absolute;

    width:125px;
    height:225px;

    bottom:13%;

    z-index:50;

    will-change:left,transform;

    transition:left .06s linear;
}

/* =========================================
   HEAD
========================================= */

.head{
    position:absolute;

    width:49px;
    height:49px;

    left:38px;
    top:0;

    background:#c9855e;

    border:4px solid #111;

    border-radius:50%;

    z-index:10;
}

/* Hair */

.head:before{
    content:"";

    position:absolute;

    left:-2px;
    top:-5px;

    width:44px;
    height:20px;

    background:#111;

    border-radius:
        50% 50% 25% 25%;
}

/* Eye */

.head:after{
    content:"";

    position:absolute;

    right:5px;
    top:20px;

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;
}

/* =========================================
   VENOM FACE
========================================= */

#venom .head{
    background:#b87555;
}

#venom .head:before{
    background:#030303;
}

/* =========================================
   BODY
========================================= */

.body{
    position:absolute;

    left:27px;
    top:48px;

    width:71px;
    height:87px;

    border:4px solid #111;

    border-radius:17px;

    z-index:5;
}

#bobby .body{
    background:
        linear-gradient(
            #2d73df,
            #123b92
        );
}

#venom .body{
    background:
        linear-gradient(
            #252525,
            #030303
        );
}

/* =========================================
   BOBBY LOGO
========================================= */

#bobby .body:after{
    content:"B";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:30px;
    font-weight:1000;

    color:#fff;

    text-shadow:
        2px 2px #000;
}

/* =========================================
   VENOM LOGO
========================================= */

#venom .body:after{
    content:"V";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:28px;
    font-weight:1000;

    color:#e52c48;

    text-shadow:
        2px 2px #000;
}

/* =========================================
   ARMS
========================================= */

.arm{
    position:absolute;

    top:54px;

    width:31px;
    height:70px;

    background:#c9855e;

    border:4px solid #111;

    border-radius:22px;

    transform-origin:
        top center;

    z-index:4;
}

.arm.left{
    left:4px;
    transform:rotate(25deg);
}

.arm.right{
    right:4px;
    transform:rotate(-25deg);
}

/* =========================================
   GLOVES
========================================= */

.glove{
    position:absolute;

    width:42px;
    height:42px;

    border-radius:50%;

    border:4px solid #111;

    z-index:20;
}

#bobby .glove{
    background:#ed2449;
}

#venom .glove{
    background:#080808;
}

.glove.left{
    left:-6px;
    top:106px;
}

.glove.right{
    right:-6px;
    top:106px;
}

/* =========================================
   LEGS
========================================= */

.leg{
    position:absolute;

    top:130px;

    width:31px;
    height:82px;

    background:#101725;

    border:4px solid #090909;

    z-index:2;
}

.leg.left{
    left:29px;
}

.leg.right{
    right:29px;
}

.leg:after{
    content:"";

    position:absolute;

    bottom:-11px;

    width:44px;
    height:18px;

    background:#070707;

    border-radius:50%;
}

.leg.left:after{
    left:-12px;
}

.leg.right:after{
    right:-12px;
}

/* =========================================
   FACING
========================================= */

#venom{
    transform:scaleX(-1);
}

/* =========================================
   ATTACK ANIMATIONS
========================================= */

.attack-jab .arm.right{
    animation:jabArm .18s ease;
}

.attack-jab .glove.right{
    animation:jabGlove .18s ease;
}

@keyframes jabArm{

    0%{
        transform:rotate(-25deg);
    }

    50%{
        transform:
            rotate(-75deg)
            translateX(25px);
    }

    100%{
        transform:rotate(-25deg);
    }
}

@keyframes jabGlove{

    0%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(38px,-12px);
    }

    100%{
        transform:translate(0,0);
    }
}

/* =========================================
   CROSS
========================================= */

.attack-cross .arm.right{
    animation:crossArm .25s ease;
}

.attack-cross .glove.right{
    animation:crossGlove .25s ease;
}

@keyframes crossArm{

    0%{
        transform:rotate(-25deg);
    }

    50%{
        transform:
            rotate(-105deg)
            translateX(40px);
    }

    100%{
        transform:rotate(-25deg);
    }
}

@keyframes crossGlove{

    0%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(50px,-22px);
    }

    100%{
        transform:translate(0,0);
    }
}

/* =========================================
   HEAVY
========================================= */

.attack-heavy .arm.right{
    animation:heavyArm .3s ease;
}

.attack-heavy .glove.right{
    animation:heavyGlove .3s ease;
}

@keyframes heavyArm{

    0%{
        transform:rotate(-25deg);
    }

    50%{
        transform:
            rotate(-125deg)
            translateX(45px);
    }

    100%{
        transform:rotate(-25deg);
    }
}

@keyframes heavyGlove{

    0%{
        transform:translate(0,0);
    }

    50%{
        transform:
            translate(58px,-32px)
            scale(1.15);
    }

    100%{
        transform:translate(0,0);
    }
}

/* =========================================
   BLOCK
========================================= */

.blocking .arm.left{
    transform:rotate(-55deg);
}

.blocking .arm.right{
    transform:rotate(55deg);
}

.blocking .glove.left{
    transform:translate(10px,-20px);
}

.blocking .glove.right{
    transform:translate(-10px,-20px);
}

/* =========================================
   HIT
========================================= */

.hit{
    animation:hitShake .22s;
}

@keyframes hitShake{

    0%{transform:translateX(0);}
    25%{transform:translateX(18px);}
    50%{transform:translateX(-15px);}
    75%{transform:translateX(9px);}
    100%{transform:translateX(0);}
}

/* =========================================
   JUMP
========================================= */

.jump{
    transform:
        translateY(-95px);
}

#venom.jump{
    transform:
        scaleX(-1)
        translateY(-95px);
}

/* =========================================
   DODGE
========================================= */

.dodge{
    animation:dodgeMove .3s ease;
}

@keyframes dodgeMove{

    0%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(-55px);
    }

    100%{
        transform:translateX(0);
    }
}

/* =========================================
   SCREEN SHAKE
========================================= */

.screenShake{
    animation:screenShake .18s;
}

@keyframes screenShake{

    0%{transform:translate(0);}
    25%{transform:translate(6px,-4px);}
    50%{transform:translate(-6px,4px);}
    75%{transform:translate(4px,2px);}
    100%{transform:translate(0);}
}

/* =========================================
   MESSAGE
========================================= */

#message{
    position:absolute;

    left:50%;
    top:34%;

    transform:translateX(-50%);

    z-index:250;

    font-size:52px;

    font-weight:1000;

    text-shadow:
        5px 5px #000;

    pointer-events:none;

    opacity:0;
}

.messageShow{
    animation:messagePop .65s;
}

@keyframes messagePop{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.4);
    }

    25%{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.25);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(1);
    }
}

/* =========================================
   IMPACT
========================================= */

#impact{
    position:absolute;

    display:none;

    z-index:300;

    font-size:55px;

    pointer-events:none;
}

/* =========================================
   CONTROLS
========================================= */

#controls{
    position:absolute;

    left:50%;
    bottom:1.2%;

    transform:translateX(-50%);

    z-index:150;

    background:rgba(0,0,0,.82);

    border:
        1px solid #4d5065;

    border-radius:6px;

    padding:8px 14px;

    font-size:12px;

    white-space:nowrap;

    color:#d7d9e5;
}

/* =========================================
   MOBILE CONTROLS
========================================= */

#mobileControls{
    display:none;

    position:absolute;

    bottom:20px;
    left:15px;
    right:15px;

    z-index:400;

    justify-content:
        space-between;

    pointer-events:none;
}

.mobileGroup{
    display:flex;
    gap:7px;
}

.mobileButton{
    width:48px;
    height:48px;

    border-radius:50%;

    border:2px solid white;

    background:rgba(0,0,0,.65);

    color:white;

    font-weight:1000;

    pointer-events:auto;
}

/* =========================================
   START / GAME OVER
========================================= */

.overlay{
    position:absolute;

    inset:0;

    z-index:500;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #292e4a,
            #05060b 75%
        );
}

#gameOver{
    display:none;
}

.overlayTitle{
    font-size:
        clamp(42px,8vw,92px);

    font-weight:1000;

    letter-spacing:5px;

    text-shadow:
        5px 5px #000,
        0 0 30px #ef233c;
}

.overlayTitle span{
    color:#ef233c;
}

.subtitle{
    margin-top:12px;

    color:#b8bdd0;

    letter-spacing:4px;

    font-size:14px;
}

.mainButton{
    margin-top:30px;

    padding:15px 48px;

    border:0;

    border-radius:5px;

    background:
        linear-gradient(
            #ff4059,
            #c71934
        );

    color:white;

    font-size:17px;

    font-weight:1000;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);
}

.mainButton:hover{
    transform:scale(1.05);
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:700px){

    #title{
        top:7px;
        font-size:25px;
        letter-spacing:2px;
    }

    .hud{
        top:45px;
        width:39%;
    }

    #roundBox{
        top:76px;
    }

    #crowd{
        top:145px;
        font-size:20px;
        letter-spacing:4px;
    }

    #ring{
        left:2%;
        right:2%;
        bottom:14%;
        height:55%;
        border-width:8px;
    }

    #controls{
        display:none;
    }

    #mobileControls{
        display:flex;
    }

    .fighter{
        transform:scale(.8);
    }

    #venom{
        transform:
            scaleX(-1)
            scale(.8);
    }

    #message{
        font-size:38px;
    }

}

</style>
</head>


<body>

<div id="game">

    <div class="light one"></div>
    <div class="light two"></div>
    <div class="light three"></div>


    <!-- TITLE -->

    <div id="title">
        BOBBY <span>BOXING</span>
    </div>


    <!-- PLAYER HUD -->

    <div
        id="playerHUD"
        class="hud">

        <div class="name">
            🥊 BOBBY
        </div>

        <div class="bar">
            <div
                id="playerHealth"
                class="fill health">
            </div>
        </div>

        <div class="bar">
            <div
                id="playerStamina"
                class="fill stamina">
            </div>
        </div>

    </div>


    <!-- VENOM HUD -->

    <div
        id="enemyHUD"
        class="hud">

        <div class="name">
            VENOM 🖤
        </div>

        <div class="bar">
            <div
                id="enemyHealth"
                class="fill health">
            </div>
        </div>

        <div class="bar">
            <div
                id="enemyStamina"
                class="fill stamina">
            </div>
        </div>

    </div>


    <!-- ROUND -->

    <div id="roundBox">

        <div id="roundText">
            ROUND 1
        </div>

        <div id="timer">
            60
        </div>

    </div>


    <!-- CROWD -->

    <div id="crowd">
        ● ● ● ● ● ● ● ● ● ● ● ● ●
    </div>


    <!-- RING -->

    <div id="ring">

        <div class="rope one"></div>
        <div class="rope two"></div>
        <div class="rope three"></div>

        <div class="post left"></div>
        <div class="post right"></div>

        <div id="floor"></div>


        <!-- BOBBY -->

        <div
            id="bobby"
            class="fighter"
            style="left:20%;">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="glove left"></div>
            <div class="glove right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>


        <!-- VENOM -->

        <div
            id="venom"
            class="fighter"
            style="left:70%;">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="glove left"></div>
            <div class="glove right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>

    </div>


    <!-- COMBO -->

    <div id="combo">

        <div id="comboNumber">
            0
        </div>

        <div id="comboText">
            HIT COMBO
        </div>

    </div>


    <!-- MESSAGE -->

    <div id="message">
        FIGHT!
    </div>


    <!-- IMPACT -->

    <div id="impact">
        💥
    </div>


    <!-- KEYBOARD CONTROLS -->

    <div id="controls">

        A / D MOVE
        &nbsp; • &nbsp;
        W JUMP
        &nbsp; • &nbsp;
        J JAB
        &nbsp; • &nbsp;
        K CROSS
        &nbsp; • &nbsp;
        L HEAVY
        &nbsp; • &nbsp;
        S BLOCK
        &nbsp; • &nbsp;
        SPACE DASH

    </div>


    <!-- MOBILE -->

    <div id="mobileControls">

        <div class="mobileGroup">

            <button
                class="mobileButton"
                data-key="a">
                ◀
            </button>

            <button
                class="mobileButton"
                data-key="d">
                ▶
            </button>

            <button
                class="mobileButton"
                data-key="w">
                ⬆
            </button>

        </div>

        <div class="mobileGroup">

            <button
                class="mobileButton"
                data-key="j">
                J
            </button>

            <button
                class="mobileButton"
                data-key="k">
                K
            </button>

            <button
                class="mobileButton"
                data-key="l">
                L
            </button>

            <button
                class="mobileButton"
                data-key="s">
                🛡
            </button>

        </div>

    </div>


    <!-- START -->

    <div
        id="startScreen"
        class="overlay">

        <div class="overlayTitle">
            BOBBY <span>BOXING</span>
        </div>

        <div class="subtitle">
            V5 • FIGHT NIGHT
        </div>

        <button
            id="startButton"
            class="mainButton">
            ENTER THE RING
        </button>

    </div>


    <!-- GAME OVER -->

    <div
        id="gameOver"
        class="overlay">

        <div
            id="result"
            class="overlayTitle">
            BOBBY <span>WINS!</span>
        </div>

        <div
            id="resultSub"
            class="subtitle">
            KNOCKOUT!
        </div>

        <button
            id="rematch"
            class="mainButton">
            REMATCH
        </button>

    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const game =
    document.getElementById("game");

const bobby =
    document.getElementById("bobby");

const venom =
    document.getElementById("venom");

const playerHealth =
    document.getElementById("playerHealth");

const enemyHealth =
    document.getElementById("enemyHealth");

const playerStamina =
    document.getElementById("playerStamina");

const enemyStamina =
    document.getElementById("enemyStamina");

const timer =
    document.getElementById("timer");

const message =
    document.getElementById("message");

const impact =
    document.getElementById("impact");

const combo =
    document.getElementById("combo");

const comboNumber =
    document.getElementById("comboNumber");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const gameOver =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultSub =
    document.getElementById("resultSub");

const rematch =
    document.getElementById("rematch");


/* =========================================
   GAME STATE
========================================= */

let running = false;

let playerHP = 100;
let venomHP = 100;

let playerSP = 100;
let venomSP = 100;

let playerX = 20;
let venomX = 70;

let timeLeft = 60;

let comboCount = 0;

let comboTimer = null;

let blocking = false;
let jumping = false;
let attacking = false;

let audioContext = null;

let aiTimer = null;
let gameTimer = null;


/* =========================================
   START
========================================= */

startButton.addEventListener(
    "click",
    startGame
);

rematch.addEventListener(
    "click",
    () => {
        location.reload();
    }
);


function startGame(){

    running = true;

    startScreen.style.display =
        "none";

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    showMessage("FIGHT!");

    playSound(
        180,
        .18,
        "square"
    );

    startClock();

    startAI();

}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!running)
            return;

        if(event.repeat)
            return;

        const key =
            event.key.toLowerCase();


        if(key === "a"){
            move(-2.5);
        }


        if(key === "d"){
            move(2.5);
        }


        if(key === "w"){
            jump();
        }


        if(key === "j"){
            attack("jab");
        }


        if(key === "k"){
            attack("cross");
        }


        if(key === "l"){
            attack("heavy");
        }


        if(key === "s"){
            startBlock();
        }


        if(event.code === "Space"){
            dash();
        }

    }
);


document.addEventListener(
    "keyup",
    function(event){

        if(
            event.key.toLowerCase()
            === "s"
        ){

            stopBlock();

        }

    }
);


/* =========================================
   MOBILE BUTTONS
========================================= */

document
.querySelectorAll(".mobileButton")
.forEach(
    button => {

        button.addEventListener(
            "touchstart",
            function(event){

                event.preventDefault();

                const key =
                    button.dataset.key;

                fakeKey(key);

            }
        );

    }
);


function fakeKey(key){

    if(!running)
        return;


    if(key === "a")
        move(-3);

    if(key === "d")
        move(3);

    if(key === "w")
        jump();

    if(key === "j")
        attack("jab");

    if(key === "k")
        attack("cross");

    if(key === "l")
        attack("heavy");

    if(key === "s")
        startBlock();

}


/* =========================================
   MOVEMENT
========================================= */

function move(amount){

    if(blocking || attacking)
        return;

    playerX += amount;

    playerX =
        Math.max(
            8,
            Math.min(
                84,
                playerX
            )
        );

    bobby.style.left =
        playerX + "%";

}


/* =========================================
   DASH
========================================= */

function dash(){

    if(blocking || playerSP < 15)
        return;

    playerSP -= 15;

    updateBars();

    bobby.classList.add("dodge");

    move(
        playerX < venomX
            ? 8
            : -8
    );

    playSound(
        350,
        .08,
        "sine"
    );

    setTimeout(
        () => {
            bobby.classList.remove(
                "dodge"
            );
        },
        300
    );

}


/* =========================================
   JUMP
========================================= */

function jump(){

    if(jumping || blocking)
        return;

    jumping = true;

    bobby.classList.add(
        "jump"
    );

    setTimeout(
        () => {

            bobby.classList.remove(
                "jump"
            );

            jumping = false;

        },
        450
    );

}


/* =========================================
   BLOCK
========================================= */

function startBlock(){

    if(attacking)
        return;

    blocking = true;

    bobby.classList.add(
        "blocking"
    );

}


function stopBlock(){

    blocking = false;

    bobby.classList.remove(
        "blocking"
    );

}


/* =========================================
   ATTACK
========================================= */

function attack(type){

    if(
        !running ||
        blocking ||
        attacking
    )
        return;


    let damage = 0;
    let cost = 0;
    let duration = 250;


    if(type === "jab"){

        damage = 7;
        cost = 4;
        duration = 190;

    }


    if(type === "cross"){

        damage = 11;
        cost = 7;
        duration = 240;

    }


    if(type === "heavy"){

        damage = 19;
        cost = 15;
        duration = 300;

    }


    if(playerSP < cost){

        showMessage(
            "TIRED!"
        );

        return;

    }


    playerSP -= cost;

    updateBars();

    attacking = true;


    const className =
        "attack-" + type;


    bobby.classList.add(
        className
    );


    playSound(
        type === "heavy"
            ? 90
            : 150,
        .08,
        "square"
    );


    setTimeout(
        () => {

            bobby.classList.remove(
                className
            );

            attacking = false;

        },
        duration
    );


    const distance =
        Math.abs(
            playerX - venomX
        );


    if(distance < 23){

        hitVenom(
            damage,
            type
        );

    }
    else{

        showMessage(
            "MISS!"
        );

    }

}


/* =========================================
   VENOM HIT
========================================= */

function hitVenom(
    damage,
    attackType
){

    if(!running)
        return;


    /* Venom occasionally blocks */

    if(
        Math.random() < .16
    ){

        showMessage(
            "BLOCKED!"
        );

        playSound(
            100,
            .1,
            "sawtooth"
        );

        return;

    }


    venomHP -= damage;

    venomHP =
        Math.max(
            0,
            venomHP
        );


    updateBars();


    venom.classList.add(
        "hit"
    );


    showImpact();

    shakeScreen();

    playSound(
        attackType === "heavy"
            ? 55
            : 110,
        .13,
        "sawtooth"
    );


    comboCount++;


    showCombo();


    if(
        attackType === "heavy"
    ){

        showMessage(
            "💥 HEAVY HIT!"
        );

    }
    else{

        showMessage(
            "HIT!"
        );

    }


    setTimeout(
        () => {

            venom.classList.remove(
                "hit"
            );

        },
        250
    );


    if(venomHP <= 0){

        knockout(
            "BOBBY"
        );

    }

}


/* =========================================
   COMBO
========================================= */

function showCombo(){

    comboNumber.innerText =
        comboCount;

    combo.classList.remove(
        "comboShow"
    );

    void combo.offsetWidth;

    combo.classList.add(
        "comboShow"
    );


    clearTimeout(
        comboTimer
    );


    comboTimer =
        setTimeout(
            () => {

                comboCount = 0;

            },
            1500
        );

}


/* =========================================
   VENOM AI
========================================= */

function startAI(){

    clearInterval(
        aiTimer
    );


    aiTimer =
        setInterval(
            () => {

                if(!running)
                    return;


                const distance =
                    Math.abs(
                        venomX - playerX
                    );


                /* Move closer */

                if(distance > 19){

                    if(
                        venomX > playerX
                    ){

                        venomX -=
                            1.2;

                    }
                    else{

                        venomX +=
                            1.2;

                    }

                    venomX =
                        Math.max(
                            8,
                            Math.min(
                                84,
                                venomX
                            )
                        );

                    venom.style.left =
                        venomX + "%";

                }


                /* Attack */

                if(
                    distance < 22 &&
                    Math.random() < .42
                ){

                    venomAttack();

                }


                /* Occasionally retreat */

                if(
                    Math.random() < .08
                ){

                    venomX +=
                        venomX > playerX
                            ? 4
                            : -4;

                    venomX =
                        Math.max(
                            8,
                            Math.min(
                                84,
                                venomX
                            )
                        );

                    venom.style.left =
                        venomX + "%";

                }

            },
            450
        );

}


/* =========================================
   VENOM ATTACK
========================================= */

function venomAttack(){

    if(
        venomSP < 8 ||
        !running
    )
        return;


    venomSP -= 8;


    const distance =
        Math.abs(
            venomX - playerX
        );


    if(distance > 23)
        return;


    venom.classList.add(
        "attack-cross"
    );


    setTimeout(
        () => {

            venom.classList.remove(
                "attack-cross"
            );

        },
        250
    );


    /* Jump dodge */

    if(jumping){

        showMessage(
            "DODGED!"
        );

        playSound(
            420,
            .07,
            "sine"
        );

        return;

    }


    let damage =
        Math.random() < .22
            ? 15
            : 8;


    /* Block */

    if(blocking){

        damage =
            Math.floor(
                damage * .2
            );

        showMessage(
            "BLOCKED!"
        );

        playSound(
            90,
            .08,
            "square"
        );

    }
    else{

        showMessage(
            "VENOM HIT!"
        );

        bobby.classList.add(
            "hit"
        );

        shakeScreen();

        playSound(
            80,
            .12,
            "sawtooth"
        );


        setTimeout(
            () => {

                bobby.classList.remove(
                    "hit"
                );

            },
            250
        );

    }


    playerHP -= damage;

    playerHP =
        Math.max(
            0,
            playerHP
        );


    updateBars();


    if(playerHP <= 0){

        knockout(
            "VENOM"
        );

    }

}


/* =========================================
   STAMINA REGEN
========================================= */

setInterval(
    () => {

        if(!running)
            return;


        playerSP =
            Math.min(
                100,
                playerSP + 2.2
            );


        venomSP =
            Math.min(
                100,
                venomSP + 2.8
            );


        updateBars();

    },
    400
);


/* =========================================
   TIMER
========================================= */

function startClock(){

    clearInterval(
        gameTimer
    );


    gameTimer =
        setInterval(
            () => {

                if(!running)
                    return;


                timeLeft--;

                timer.innerText =
                    timeLeft;


                if(timeLeft <= 10){

                    timer.classList.add(
                        "danger"
                    );

                }


                if(timeLeft <= 0){

                    clearInterval(
                        gameTimer
                    );

                    pointsResult();

                }

            },
            1000
        );

}


/* =========================================
   UPDATE HUD
========================================= */

function updateBars(){

    playerHealth.style.width =
        playerHP + "%";

    enemyHealth.style.width =
        venomHP + "%";

    playerStamina.style.width =
        playerSP + "%";

    enemyStamina.style.width =
        venomSP + "%";

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

    message.innerText =
        text;

    message.classList.remove(
        "messageShow"
    );

    void message.offsetWidth;

    message.classList.add(
        "messageShow"
    );

}


/* =========================================
   IMPACT
========================================= */

function showImpact(){

    impact.style.display =
        "block";


    const ring =
        document.getElementById(
            "ring"
        );


    const rect =
        ring.getBoundingClientRect();


    impact.style.left =
        (
            rect.left +
            rect.width * .5
        ) + "px";


    impact.style.top =
        (
            rect.top +
            rect.height * .42
        ) + "px";


    setTimeout(
        () => {

            impact.style.display =
                "none";

        },
        220
    );

}


/* =========================================
   SCREEN SHAKE
========================================= */

function shakeScreen(){

    game.classList.remove(
        "screenShake"
    );

    void game.offsetWidth;

    game.classList.add(
        "screenShake"
    );

}


/* =========================================
   KNOCKOUT
========================================= */

function knockout(winner){

    running = false;

    clearInterval(
        aiTimer
    );

    clearInterval(
        gameTimer
    );


    showMessage(
        "K.O.!"
    );


    if(winner === "BOBBY"){

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultSub.innerText =
            "🥊 KNOCKOUT! 🥊";

    }
    else{

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultSub.innerText =
            "🖤 BOBBY HAS BEEN KNOCKED OUT";

    }


    setTimeout(
        () => {

            gameOver.style.display =
                "flex";

        },
        900
    );

}


/* =========================================
   POINTS
========================================= */

function pointsResult(){

    running = false;

    clearInterval(
        aiTimer
    );


    if(
        playerHP >
        venomHP
    ){

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultSub.innerText =
            "🏆 WIN BY POINTS";

    }
    else if(
        venomHP >
        playerHP
    ){

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultSub.innerText =
            "🖤 VENOM WINS BY POINTS";

    }
    else{

        result.innerHTML =
            '<span>DRAW!</span>';

        resultSub.innerText =
            "🔥 WHAT A FIGHT!";

    }


    gameOver.style.display =
        "flex";

}


/* =========================================
   SOUND
========================================= */

function playSound(
    frequency,
    duration,
    type
){

    if(!audioContext)
        return;


    try{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .15,
            audioContext.currentTime + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + duration
        );


        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }
    catch(error){

        /* Audio is optional.
           Game continues normally. */

    }

}


/* =========================================
   INITIAL
========================================= */

updateBars();

</script>

</body>
</html>
